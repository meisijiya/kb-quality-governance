openapi: 3.0.3

info:
  title: 企业知识库质量治理系统 API
  version: 0.1.0
  description: |
    W7–W9 Web 交付的机器可读接口契约。**本文件是草案，尚未定稿。**

    状态（未拍板，不得当作已确认的接口契约）：
      - Issue #3 已撤回为 `needs-triage`，其正文不再是已确认的规格来源；本文件
        只是把该工单的接口描述转写为机器可读形式，供讨论用。
      - 需求方已就三项给出口径并要求落进契约：P1「按推荐」、P2「按推荐且保证查询
        性能」、P5「必要的 CRUD 要有」。本文件已按该口径改；凡仍需拍板的地方一律
        在 description 里标【待拍板】，不得当作已确认的契约。
      - 列排序（D1）已按实施口径砍掉：`docs/技术方案/本科版实施方案.md` §2.2 第 104 行
        与 §3 第 120 行把「分页 / 排序 / 跳转详情」列为砍掉项，Issue #3 第 201 行的
        排序参数要求不采纳。三个清单接口因此不再提供 `sort` 参数。
      - 产品形态已定：前后端分离，且必须「一条命令启动前后端」（需求方 2026-10-24 P3 口径）。
        UI 形态仍待定，见 `docs/技术方案/开发前准备清单.md` §4。

    来源：
      - GitHub Issue #3「前后端接口契约（技术方案未定义，此处补齐）」
      - docs/技术方案/企业知识库质量治理系统技术方案.md §4.3 / §4.4
      - 数据表定义见 system/schema.sql

    字段映射（PoC 产物列 ↔ 本契约与数据库列，取值逐一对齐）：
      | PoC 产物列 | 本契约 / 数据库列 | 说明 |
      |---|---|---|
      | docs.csv → doc_id | document.doc_code / DocumentUpload.doc_code | 取值相同，仅列名不同 |
      | docs.csv → title / content | document.title / content | 一致 |
      | docs.csv → category | document.domain / DocumentUpload.domain | 同一业务域，列名不同 |
      | docs.csv → created_at / last_modified / effective_date | 同名列 | 一致 |
      | docs.csv → status / ref_count | 同名列 | 一致；ref_count 缺省 0 |
      | tickets.csv → ticket_id | ticket.ticket_code | 取值相同，仅列名不同 |
      | tickets.csv → intent_label | ticket.intent_label | 一致 |
      | tickets.csv → linked_doc_id | ticket.linked_doc_id → document(doc_code) | **是文档编码文本，不是行号** |
      | top15_gaps.csv → rank / intent / size / cover_median / rep_cover / rep_ticket / rep_text | GapRow 同名列 ↔ knowledge_gap | 一致；真值标注列不透出 |
      | corrupt_docs.csv → doc_id / title / category / last_modified / risk_score / rule_hits / reasons | StaleRow 同名列 ↔ stale_document | 一致；真值与归因列不透出 |
      | dup_groups_best.csv → group / size / primary_doc / member_docs / max_sim | DuplicateRow 同名列 ↔ duplicate_group | 一致；真值标注列不透出 |
      | docs.csv → doc_id / title / category / created_at / last_modified / effective_date / status / ref_count | DocumentSummary 同名列 ↔ document | 取值一致；doc_id→doc_code、category→domain 见上两行；正文 content 不进列表 |
      | tickets.csv → ticket_id / intent_label / channel / urgency / status / handling_minutes / linked_doc_id / created_at | TicketSummary 同名列 ↔ ticket | 取值一致；ticket_id→ticket_code 见上表；正文 content 不进列表 |
      | metrics.json → gap.best / corrupt.* / dup.best | 三个清单接口的 threshold / precision / recall / f1 / count | 一致；另加 has_ground_truth（是否有真值）与 row_order（行序定义）两个本文件自有的字段 |

      源数据中 linked_doc_id 的实测分布：tickets.csv 2000 行中 1629 行非空，
      全部能对上 docs.csv 的 doc_id（未匹配的 0 行）。

    契约要点（Issue #3 的断言 + 2026-10-24 需求方口径 P1 / P2 / P5）：
      - 全部接口返回 JSON；错误响应体统一为 {code, message, location}：机器可读错误码 + 中文说明 + 出错位置。
        请求体结构不合法（缺必填字段 / 类型不匹配）返回 422 + VALIDATION_FAILED，
        FastAPI 默认的 {"detail":[...]} 形状被显式收编进这个错误体。
      - 错误码枚举里的每个取值都必须至少被一条路径引用；无路径引用的错误码不得留在枚举里。
      - POST /api/scan 同步跑完「向量化 → 聚类 → 三模块检测 → 落库」，不引入任务队列。
      - GET /api/gaps、/api/stale、/api/duplicates 返回「清单行 + 本次 threshold 与 P/R/F1」。
      - 清单接口不支持列排序、不分页：行序 = 源 CSV 行序，由响应里的 row_order 字段声明，
        每一档的行序都能按「文件路径 + 列名」复核。
      - 阈值与主指标一律从本次扫描落盘的 metrics.json 读取，不在前端代码里硬编码。
      - 清单行的字段名与取值与对应 CSV 的列一致（缺口 top15_gaps.csv、腐化 corrupt_docs.csv、重复 dup_groups_best.csv）。
      - 清单接口不返回真值标注列：源 CSV 的真值标注列不作为字段出现在任何响应里
        （真值只留在产物文件与论文中，见开发前准备清单 §4.10 A14）；下载件则保留全量列。
      - precision / recall / f1 可为 null：无真值语料时 has_ground_truth = false，
        三个指标恒为 null（不是 0）；has_ground_truth = true 时才有值。
      - count 是「本次命中数量」，三个清单的统计单元不同：缺口=簇、腐化=文档、重复=组。
      - 文档与工单各自提供 POST（导入）/ GET（查询）/ DELETE（单条删除 + 整批清空，
        清空是重导的前置动作）；三类缺陷清单只读。内容字段落库后只读，编辑语义等于
        重新导入（在线编辑已按 `docs/技术方案/本科版实施方案.md` §3 第 135 行砍掉）。
      - P3 形态：前后端分离 + 一条命令启动前后端——后端单进程（FastAPI + uvicorn）
        挂载前端构建产物，SQLite 以 WAL 模式运行（PRAGMA journal_mode = WAL，见
        system/schema.sql）；契约里 GET / 就是静态挂载点。
      - 数字纪律：本文档里的每个数值都来自 poc/kbgovernance/metrics.json 或对应 CSV，不来自叙述性文本。

    2026-10-23 评审结论对本契约的影响（技术方案评审团 + 架构评审，共 5 份报告；
    逐条复现记录见 docs/技术方案/开发前准备清单.md §4.10 与 §6.2）：
      - 已在本文件内修正的自相矛盾：sort 取值与清单行字段名不同名、错误码枚举不闭合
        （工单 409 曾复用 DUPLICATE_DOC_CODE）、缺少 422 校验错误响应、真值列外泄、
        /api/scan/status 把「各阶段耗时之和」写成需求阈值、/api/gaps 未说明 rows 上限。
      - 已按 2026-10-24 需求方口径（P1 / P2 / P5）在本文件内继续修正：删除三个清单的
        `sort` 参数并把行序写进响应；P/R/F1 改可空并新增 has_ground_truth；
        count 写明统计单元；/api/scan 增加请求体区分复现模式与自有语料模式；
        /api/downloads/{name} 的文件枚举对齐 poc/kbgovernance/ 实际产物；
        补齐语料侧的查看与清空接口。
      - 仍需需求方拍板、本文件不做单方面决定的（本文件中以【待拍板】标注）：
        清单是否分页、是否另设独立详情端点、是否允许 DELETE 整批语料、
        文档上传是否也收文件、两种上传形态是否统一、扫描是否清空语料表、
        linked_doc_id 未命中是拒绝该行还是写 NULL（A17 与现行草案冲突）、
        linked_doc_id 与簇号的数据形态、清单行字段与落库列的缺口
        （top15_gaps.csv 的 rep_cover 没有对应列）。取舍见准备清单 §4.10 与 §4.11。

servers:
  - url: /
    description: 同一后端进程，路径相对服务根（FastAPI + uvicorn，本地单进程）

tags:
  - name: system
    description: 健康检查等系统级接口
  - name: corpus
    description: 语料录入（文档 / 工单）与语料统计
  - name: scan
    description: 治理扫描（同步执行）
  - name: findings
    description: 三类缺陷清单
  - name: artifacts
    description: 产物下载与指标读取

paths:

  /api/health:
    get:
      tags: [system]
      summary: 健康检查
      description: 前端启动时探活。响应体为 JSON，后端不返回任何 HTML 页面。
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok

  /api/corpus/stats:
    get:
      tags: [corpus]
      summary: 语料统计
      description: 已录入的文档数 / 工单数 / 段落数，字段名与 metrics.json → embedding 的同名字段一致。
      responses:
        '200':
          description: 当前库中语料规模
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusStats'
              example:
                n_docs: 300
                n_tickets: 2000
                n_passages: 1852

  /api/documents:
    post:
      tags: [corpus]
      summary: 上传知识文档
      description: |
        录入待治理的知识文档，整批在一次事务内提交：全成功或全回滚，不留半截数据（Issue #3 User Story 7）。

        字段与 system/schema.sql 的 document 表列一一对应；
        created_at 由服务端写入 ISO-8601 时间，ref_count 缺省 0、status 缺省「生效」。
        doc_code 重复时整批拒绝并返回冲突的编码值（Issue #3 User Story 5）。

        **【待拍板】上传形态**：本接口收 JSON 体（批量），/api/tickets 收文件上传
        （multipart）。文档与工单是两个不同的数据对象（字段与校验规则不同：
        文档有 doc_code / title / content / last_modified，工单有 ticket_id /
        content / intent_label / created_at），按「不合并两个接口」的原则两者保持
        独立。待拍板的是：① 文档上传是否也提供文件上传（multipart）形态；
        ② 是否让两侧形态统一。
        推荐：文档侧同时支持 JSON 体与 multipart 文件两种形态（JSON 体给程序化
        批量导入，文件形态给人工上传），工单侧保持文件为主。
        代价：每个导入接口要维护两套解析与两套错误定位口径（文件形态下
        location 的 row / column 要重新定义），实现与测试量增加；不做则两侧
        形态不对称，前端要写两套上传逻辑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  minItems: 1
                  description: 本批上传的文档列表
                  items:
                    $ref: '#/components/schemas/DocumentUpload'
            example:
              documents:
                - doc_code: DOC0001
                  title: 关于差旅费报销适用范围的说明（第1版）
                  content: 正文内容……
                  domain: 财务管理
                  last_modified: '2025-07-15'
                  effective_date: '2024-02-19'
      responses:
        '200':
          description: 整批写入成功
          content:
            application/json:
              schema:
                type: object
                required: [inserted]
                properties:
                  inserted:
                    type: integer
                    description: 本次成功写入的文档条数
              example:
                inserted: 300
        '400':
          description: 文档字段不合法（缺字段 / 日期非 ISO-8601 等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_IMPORT_FILE
                message: 文档 DOC0007 的 last_modified 不是 ISO-8601 日期
                location:
                  row: 7
                  column: last_modified
                  value: '2025/07/15'
        '409':
          description: 文档编码重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DUPLICATE_DOC_CODE
                message: 文档编码 DOC0001 已存在，整批导入已回滚
                location:
                  value: DOC0001
        '422':
          description: |
            请求体结构不合法（缺必填字段 / 类型不匹配）。

            **实现方必须把 FastAPI 默认的 RequestValidationError 响应转换成本错误体**：
            FastAPI 默认返回 `{"detail":[...]}`，形状与本契约的统一错误体
            `{code, message, location}` 不同；不装转换处理器时实际返回会与本契约
            不一致。转换后的 location 至少给出出错的字段名。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_FAILED
                message: 请求体不合法：documents 必填，且每个文档必须含 doc_code / title / content / last_modified
                location:
                  column: documents

    get:
      tags: [corpus]
      summary: 查看已录入的文档
      description: |
        语料侧的「可查看」：返回已录入文档的清单行。

        行序 = 源 CSV 行序，本接口固定为 document.id 升序（导入写入顺序），
        对应响应里的 row_order 字段。

        正文 content 不进列表（300 篇文档的正文全量返回没有意义）；要正文时按
        doc_code 过滤取单篇。

        count 的统计单元是「文档」。
      parameters:
        - name: domain
          in: query
          required: false
          description: 按业务域过滤（命中 idx_doc_domain）
          schema:
            type: string
        - name: doc_code
          in: query
          required: false
          description: 按文档编码精确取一篇（命中 document.doc_code 的唯一约束）
          schema:
            type: string
      responses:
        '200':
          description: 文档清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
              example:
                count: 300
                row_order: document.id 升序（导入写入顺序）
                rows:
                  - doc_code: DOC0001
                    title: 关于差旅费报销适用范围的说明（第1版）
                    domain: 财务管理
                    created_at: '2024-02-07'
                    last_modified: '2025-07-15'
                    effective_date: '2024-02-19'
                    status: 生效
                    ref_count: 24

    delete:
      tags: [corpus]
      summary: 清空已录入的文档
      description: |
        「清空重导」的前置动作：清空文档语料。一次事务内按外键依赖的子表 → 父表
        顺序执行——先删 stale_document 与 duplicate_group（document 的子表），
        再删 document。

        ticket.linked_doc_id 指向 document(doc_code)，因此删文档前先把仍在引用被删
        文档的工单外键置 NULL（未匹配到文档时写 NULL 是既定语义，见 system/schema.sql），
        否则 SQLite 会报 FOREIGN KEY constraint failed；工单本身保留。

        【待拍板】是否允许 DELETE 整批语料：需求方 P5 只说「文档与工单可清空重导」，
        没明确是否提供显式的整批删除接口。本接口按推荐给出（清空是重导的前置动作），
        代价是一次误调用即清掉整批文档且不可撤销，前端必须给二次确认与影响面提示；
        若需求方要求「不开显式接口、清库只由扫描流程隐含完成」，则删掉本接口。
      responses:
        '200':
          description: 已清空
          content:
            application/json:
              schema:
                type: object
                required: [deleted, tickets_unlinked]
                properties:
                  deleted:
                    type: integer
                    description: 本次删除的文档条数
                  tickets_unlinked:
                    type: integer
                    description: 因文档被删而把 linked_doc_id 置 NULL 的工单条数
              example:
                deleted: 300
                tickets_unlinked: 1629
        '409':
          description: 已有扫描在执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SCAN_IN_PROGRESS
                message: 已有扫描在执行，请等待当前扫描结束后再清空语料
                location: {}

  /api/documents/{doc_code}:
    delete:
      tags: [corpus]
      summary: 删除单篇文档
      description: |
        「可删除（单条）」：按文档编码删一篇文档。

        子表 → 父表顺序：先删引用该文档的 stale_document 与 duplicate_group 行，
        再删 document；同时把仍引用它的 ticket.linked_doc_id 置 NULL（工单本身保留），
        否则 SQLite 会报 FOREIGN KEY constraint failed。

        命中 doc_code 唯一约束（document.doc_code），因此这条路径走唯一索引查找。

        【待拍板】单条删除是否与整批清空并存：本接口按推荐给出（删除单篇是「重导前
        局部订正」的最小能力）；代价是删除不可撤销，且需要前端对影响面（关联的腐化 /
        重复行、被解绑的工单数）给出确认提示。
      parameters:
        - name: doc_code
          in: path
          required: true
          description: 文档编码（命中 document.doc_code 的唯一约束）
          schema:
            type: string
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted, tickets_unlinked]
                properties:
                  deleted:
                    type: integer
                    description: 本次删除的文档条数
                  tickets_unlinked:
                    type: integer
                    description: 因文档被删而把 linked_doc_id 置 NULL 的工单条数
              example:
                deleted: 1
                tickets_unlinked: 3
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: 文档 DOC0001 不存在
                location:
                  value: DOC0001

  /api/tickets:
    post:
      tags: [corpus]
      summary: 批量导入客服工单
      description: |
        上传 CSV 或 JSON 文件批量导入工单，整批在一次事务内提交（Issue #3 User Story 2 / 7）。

        CSV 的列名与 poc/kbgovernance/tickets.csv 一致：
        ticket_id, created_at, channel, content, intent_label, urgency, status, handling_minutes, linked_doc_id
        其中 ticket_id / content / intent_label / created_at 为必填，缺列时错误体给出缺失列名与行号。

        linked_doc_id 是**文档编码文本**（形如 DOC0001），对应 ticket.linked_doc_id →
        document.doc_code 的外键，不是 document.id 的行号；空值与未匹配到文档时写 NULL，
        不做「空串占位」（空串不是合法外键值，SQLite 会直接报 FOREIGN KEY constraint failed）。

        JSON 文件为上述字段的数组。

        上传的文件被原样保存，便于对比系统读到的与上传的是否一致（Issue #3 User Story 9）。

        **【待拍板】上传形态**：本接口收文件上传（multipart），与 /api/documents 的
        JSON 体形态不一致。文档与工单是两个不同的数据对象（字段与校验规则不同），
        按「不合并两个接口」的原则两者保持独立；是否让两侧形态统一（文档侧也收
        文件 / 工单侧也收 JSON 体）见 /api/documents 的【待拍板】标注，两处需一起
        拍板。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 工单文件（CSV 或 JSON）
      responses:
        '200':
          description: 整批写入成功
          content:
            application/json:
              schema:
                type: object
                required: [inserted]
                properties:
                  inserted:
                    type: integer
                    description: 本次成功写入的工单条数
              example:
                inserted: 2000
        '400':
          description: 文件格式不合法（缺列 / 行内取值非法 / 编码无法解析）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_IMPORT_FILE
                message: 工单文件缺少必填列 intent_label
                location:
                  row: 1
                  column: intent_label
        '409':
          description: 工单编码重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DUPLICATE_TICKET_CODE
                message: 工单编码 TK00019 已存在，整批导入已回滚
                location:
                  value: TK00019
        '422':
          description: |
            请求体结构不合法（缺必填字段 / 类型不匹配）。

            **实现方必须把 FastAPI 默认的 RequestValidationError 响应转换成本错误体**：
            FastAPI 默认返回 `{"detail":[...]}`，形状与本契约的统一错误体
            `{code, message, location}` 不同；不装转换处理器时实际返回会与本契约
            不一致。转换后的 location 至少给出出错的字段名。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_FAILED
                message: 请求体不合法：文件字段缺失或类型不匹配，工单行必须含 ticket_id / content / intent_label / created_at
                location:
                  column: file

    get:
      tags: [corpus]
      summary: 查看已录入的工单
      description: |
        语料侧的「可查询」：返回已录入工单的清单行。

        行序 = 源 CSV 行序，本接口固定为 ticket.id 升序（导入写入顺序），
        对应响应里的 row_order 字段。

        正文 content 不进列表（2000 条工单的正文全量返回没有意义）；要正文时按
        ticket_code 过滤取单条。

        count 的统计单元是「工单」。

        过滤参数 intent_label 走 idx_ticket_intent，linked_doc_id 走 idx_ticket_linked_doc。
      parameters:
        - name: intent_label
          in: query
          required: false
          description: 按意图标签过滤（命中 idx_ticket_intent）
          schema:
            type: string
        - name: linked_doc_id
          in: query
          required: false
          description: 按关联文档编码过滤（命中 idx_ticket_linked_doc）
          schema:
            type: string
        - name: ticket_code
          in: query
          required: false
          description: 按工单编码精确取一条（命中 ticket.ticket_code 的唯一约束）
          schema:
            type: string
      responses:
        '200':
          description: 工单清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
              example:
                count: 2000
                row_order: ticket.id 升序（导入写入顺序）
                rows:
                  - ticket_code: TK00001
                    intent_label: 门禁权限申请
                    channel: 电话
                    urgency: 中
                    status: 已解决
                    handling_minutes: 42
                    linked_doc_id: DOC0265
                    created_at: '2026-09-18T17:00'

    delete:
      tags: [corpus]
      summary: 清空已录入的工单
      description: |
        「可删除（批量）」：清空工单语料。ticket 没有子表，一次事务内直接删空；
        外键方向是工单指向文档，因此删工单不影响文档。

        【待拍板】是否允许 DELETE 整批语料：与 DELETE /api/documents 同一条待拍板项。
        本接口按推荐给出，代价同前（一次误调用即清掉整批工单且不可撤销）。
      responses:
        '200':
          description: 已清空
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
                    description: 本次删除的工单条数
              example:
                deleted: 2000
        '409':
          description: 已有扫描在执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SCAN_IN_PROGRESS
                message: 已有扫描在执行，请等待当前扫描结束后再清空语料
                location: {}

  /api/tickets/{ticket_code}:
    delete:
      tags: [corpus]
      summary: 删除单条工单
      description: |
        「可删除（单条）」：按工单编码删一条工单。

        ticket 没有子表，直接删即可；文档与其它工单不受影响（外键方向是工单指向文档）。

        命中 ticket.ticket_code 的唯一约束。

        【待拍板】单条删除是否与整批清空并存：同 DELETE /api/documents/{doc_code}，
        按推荐给出，代价是删除不可撤销，前端需给确认提示。
      parameters:
        - name: ticket_code
          in: path
          required: true
          description: 工单编码（命中 ticket.ticket_code 的唯一约束）
          schema:
            type: string
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
                    description: 本次删除的工单条数
              example:
                deleted: 1
        '404':
          description: 工单不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: 工单 TK00001 不存在
                location:
                  value: TK00001

  /api/scan:
    post:
      tags: [scan]
      summary: 一键运行治理扫描（同步）
      description: |
        同步串行跑完「向量化 → 聚类 → 三模块检测 → 落库」，不引入任务队列（Issue #3）。

        请求体里的 mode 决定语料来源与阈值口径：reproduce 用仓库自带的 PoC 语料与固定
        阈值，custom 用 POST /api/documents 与 POST /api/tickets 录入的语料与请求里给的
        阈值。两种模式的产物落盘位置相同、且与论文基线物理隔离；指标可得性不同
        （见 ScanRequest 的 has_ground_truth 说明）。

        扫描产物沿用 run_all.sh 的文件路径与文件名
        （metrics.json / top15_gaps.csv / corrupt_docs.csv / dup_groups_best.csv 等），
        因此「下载的 CSV 与源文件逐字节一致」与「Web 产物 vs run_all.sh 复跑产物逐字节一致」
        是同一条性质的验证。

        **产物落盘目录与论文基线物理隔离**（口径：docs/技术方案/开发前准备清单.md
        §4.10 A10「扫描产物落盘目录 → 与论文基线物理隔离」）。Web 扫描写独立工作目录，
        poc/kbgovernance/ 只读；若写回同一目录会覆盖仓库里的论文溯源基线，并连带作废
        poc/kbgovernance/repro_check.json 的逐字节基线与 sync_timings.py 的同步目标。
        契约只约定「落盘目录不与 poc/kbgovernance/ 重叠」，具体路径由实现确定。

        **复现模式用固定阈值，不按真值择优**（口径：§4.10 A12「阈值选取策略」）。
        poc/kbgovernance/detect.py 第 117–127 行与 第 403 行是拿真值择优取 best 的；
        复现模式沿用其固定阈值（覆盖度 0.62 / 风险分 3 / 余弦 0.95，取自
        poc/kbgovernance/metrics.json → gap.best.threshold、corrupt.score_threshold、
        dup.best.threshold），不重新扫参择优。

        每次扫描生成一个 scan_id（口径：§4.10 A16「扫描轮次标识与清库语义」），
        重复扫描时旧结果被清空而不是叠加（Issue #3 User Story 15）；
        清库只清结果表、不动语料表，且必须按外键依赖的子表 → 父表顺序执行：
        先删 knowledge_gap（cluster_result 的子表）→ 再删 cluster_result；
        先删 stale_document / duplicate_group（document 的子表）→ 保留
        document / ticket 不动。否则 SQLite 会报 FOREIGN KEY constraint failed。
        数据库侧还需在**每个连接**上设置 PRAGMA foreign_keys = ON（该开关按连接生效，
        不随建表脚本持久化）。

        【待拍板】扫描是否清空语料表：OPEN-1 问的是「扫描要不要连 document / ticket
        一起清掉」。本契约按推荐只清结果表（语料保留，扫描可反复重跑），代价是扫描
        前的语料快照要用户自己管；若要求扫描即清空，则 DELETE /api/documents 与
        DELETE /api/tickets 的整批清空语义改由扫描隐含完成。
        同一时刻只允许一个扫描在执行，重复请求返回「已有扫描在执行」（Issue #3 User Story 61）。
        语料为空时返回明确的 4xx，不抛未捕获异常（Issue #3 User Story 53）。
        模型权重缺失时返回明确的 HF_HOME 指引（Issue #3 User Story 17）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
            example:
              mode: reproduce
      responses:
        '200':
          description: 扫描完成，返回本次的阶段耗时与三模块主指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
              example:
                status: completed
                scan_id: scan-0001
                mode: reproduce
                artifacts_dir: 与 poc/kbgovernance/ 物理隔离的扫描工作目录（路径由实现确定）
                seconds:
                  encoding: 14.61
                  gap: null
                  corrupt: 0.4
                  duplicate: 0.0
                  total: 3.09
                modules:
                  gap:
                    threshold: 0.62
                    precision: 0.8
                    recall: 0.8
                    f1: 0.8
                    count: 7
                    has_ground_truth: true
                  corrupt:
                    threshold: 3
                    precision: 0.8986
                    recall: 1.0
                    f1: 0.9466
                    count: 69
                    has_ground_truth: true
                  duplicate:
                    threshold: 0.95
                    precision: 1.0
                    recall: 1.0
                    f1: 1.0
                    count: 22
                    has_ground_truth: true
        '400':
          description: 语料为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: EMPTY_CORPUS
                message: 语料为空：请先通过 POST /api/documents 与 POST /api/tickets 录入文档和工单，再运行扫描
                location: {}
        '409':
          description: 已有扫描在执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SCAN_IN_PROGRESS
                message: 已有扫描在执行，请等待当前扫描结束后重试
                location: {}
        '500':
          description: 扫描失败（模型权重缺失或其他原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                model_weights_missing:
                  summary: 模型权重缺失
                  value:
                    code: MODEL_WEIGHTS_MISSING
                    message: 未找到 BAAI/bge-small-zh-v1.5 模型权重：请把 HF_HOME 设为 D:/hf_cache，避免权重落进 C 盘系统盘
                    location: {}
                scan_failed:
                  summary: 扫描执行失败
                  value:
                    code: SCAN_FAILED
                    message: 扫描执行失败：向量聚类阶段异常，未产出清单，请查看服务端日志
                    location: {}

  /api/scan/status:
    get:
      tags: [scan]
      summary: 最近一次扫描的状态
      description: |
        返回最近一次扫描的状态、scan_id、落盘目录、各阶段耗时、三模块命中数与主指标。

        60 秒需求阈值（Issue #3 断言清单第 6 条）比对的是 seconds.total
        （对应 metrics.json → total_seconds，即检测环节的全流程墙钟，含聚类开销），
        **不是各阶段耗时之和**：现产物中 corrupt.seconds = 0.4、dup.best.seconds = 0.0，
        缺口阶段在产物里没有独立耗时字段——seconds.gap 恒为 null，表示**不可得**，
        不是 0；三者相加也不等于 total。

        从未扫描过时 status = never_scanned，scan_id / mode / artifacts_dir / seconds /
        modules 均为 null。
      responses:
        '200':
          description: 最近一次扫描的快照
          content:
            application/json:
