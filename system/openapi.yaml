openapi: 3.0.3

info:
  title: 企业知识库质量治理系统 API
  version: 0.1.0
  description: |
    W7–W9 Web 交付的机器可读接口契约。**本文件是草案，尚未定稿。**

    状态（未拍板，不得当作已确认的接口契约）：
      - Issue #3 已撤回为 `needs-triage`，其正文不再是已确认的规格来源；本文件
        只是把该工单的接口描述转写为机器可读形式，供讨论用。
      - D1（清单接口是否支持列排序）尚未拍板：实施口径
        `docs/技术方案/本科版实施方案.md` §2.2 第 104 行与 §3 第 120 行把「列排序」
        列为砍掉项，Issue #3 第 201 行则要求保留最小排序参数，两者冲突未决。
        三个清单接口的 `sort` 参数因此是草案占位。
      - API 契约的取舍范围、产品形态（前后端分离与否）、UI 形态、功能范围
        均尚未与需求方讨论定案，见 `docs/技术方案/开发前准备清单.md` §4。

    来源：
      - GitHub Issue #3「前后端接口契约（技术方案未定义，此处补齐）」
      - docs/技术方案/企业知识库质量治理系统技术方案.md §4.3 / §4.4
      - 数据表定义见 system/schema.sql

    字段映射（PoC 产物列 ↔ 本契约与数据库列，取值逐一对齐）：
      | PoC 产物列 | 本契约 / 数据库列 | 说明 |
      |---|---|---|
      | docs.csv → doc_id | document.doc_code / DocumentUpload.doc_code | 取值相同，仅列名不同 |
      | docs.csv → title / content | document.title / content | 一致 |
      | docs.csv → category | document.domain / DocumentUpload.domain | 同一业务域，列名不同 |
      | docs.csv → created_at / last_modified / effective_date | 同名列 | 一致 |
      | docs.csv → status / ref_count | 同名列 | 一致；ref_count 缺省 0 |
      | tickets.csv → ticket_id | ticket.ticket_code | 取值相同，仅列名不同 |
      | tickets.csv → intent_label | ticket.intent_label | 一致 |
      | tickets.csv → linked_doc_id | ticket.linked_doc_id → document(doc_code) | **是文档编码文本，不是行号** |
      | top15_gaps.csv → rank / intent / size / cover_median / rep_cover / rep_ticket / rep_text | GapRow 同名列 ↔ knowledge_gap | 一致；is_true_gap 不透出 |
      | corrupt_docs.csv → doc_id / title / category / last_modified / risk_score / rule_hits / reasons | StaleRow 同名列 ↔ stale_document | 一致；归因列不透出 |
      | dup_groups_best.csv → group / size / primary_doc / member_docs / max_sim | DuplicateRow 同名列 ↔ duplicate_group | 一致；is_true_group 不透出 |
      | metrics.json → gap.best / corrupt.* / dup.best | 三个清单接口的 threshold / precision / recall / f1 / count | 一致 |

      源数据中 linked_doc_id 的实测分布：tickets.csv 2000 行中 1629 行非空，
      全部能对上 docs.csv 的 doc_id（未匹配的 0 行）。

    契约要点（逐条来自 Issue #3）：
      - 全部接口返回 JSON；错误响应体统一为 {code, message, location}：机器可读错误码 + 中文说明 + 出错位置。
      - POST /api/scan 同步跑完「向量化 → 聚类 → 三模块检测 → 落库」，不引入任务队列。
      - GET /api/gaps、/api/stale、/api/duplicates 返回「清单行 + 本次 threshold 与 P/R/F1」。
      - 清单接口只支持最小排序参数，不实现分页。排序参数的取值就是对应 CSV 的列名
        （缺口 size / 腐化 risk_score / 重复 max_sim），与清单行的字段名同名同义。
      - 阈值与主指标一律从本次扫描落盘的 metrics.json 读取，不在前端代码里硬编码。
      - 清单行的字段名与取值与对应 CSV 的列一致（缺口 top15_gaps.csv、腐化 corrupt_docs.csv、重复 dup_groups_best.csv）。
      - 清单接口不返回真值标注列：is_true_gap / is_true_group 不出现在任何响应里
        （真值只留在产物文件与论文中，见开发前准备清单 C7）。
      - 数字纪律：本文档里的每个数值都来自 poc/kbgovernance/metrics.json 或对应 CSV，不来自叙述性文本。

    2026-10-23 评审结论对本契约的影响（技术方案评审团 + 架构评审，共 5 份报告；
    逐条复现记录见 docs/技术方案/开发前准备清单.md §4.10 与 §6.2）：
      - 已在本文件内修正的自相矛盾：sort 取值与清单行字段名不同名、错误码枚举不闭合
        （工单 409 曾复用 DUPLICATE_DOC_CODE）、缺少 422 校验错误响应、真值列外泄、
        /api/scan/status 把「各阶段耗时之和」写成需求阈值、/api/gaps 未说明 rows 上限。
      - 仍需需求方拍板、本文件不做单方面决定的：扫描产物落盘目录是否与
        poc/kbgovernance/ 物理隔离（A1）、自有语料无真值时 P/R/F1 是否置空（A3）、
        /api/metrics 是否原样透传含真值派生字段的 metrics.json、以及清单接口的
        列排序去留（D1）。这四项的取舍见准备清单 §4.10 与 §4.11。

servers:
  - url: /
    description: 同一后端进程，路径相对服务根（FastAPI + uvicorn，本地单进程）

tags:
  - name: system
    description: 健康检查等系统级接口
  - name: corpus
    description: 语料录入（文档 / 工单）与语料统计
  - name: scan
    description: 治理扫描（同步执行）
  - name: findings
    description: 三类缺陷清单
  - name: artifacts
    description: 产物下载与指标读取

paths:

  /api/health:
    get:
      tags: [system]
      summary: 健康检查
      description: 前端启动时探活。响应体为 JSON，后端不返回任何 HTML 页面。
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok

  /api/corpus/stats:
    get:
      tags: [corpus]
      summary: 语料统计
      description: 已录入的文档数 / 工单数 / 段落数，字段名与 metrics.json → embedding 的同名字段一致。
      responses:
        '200':
          description: 当前库中语料规模
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusStats'
              example:
                n_docs: 300
                n_tickets: 2000
                n_passages: 1852

  /api/documents:
    post:
      tags: [corpus]
      summary: 上传知识文档
      description: |
        录入待治理的知识文档，整批在一次事务内提交：全成功或全回滚，不留半截数据（Issue #3 User Story 7）。

        字段与 system/schema.sql 的 document 表列一一对应；
        created_at 由服务端写入 ISO-8601 时间，ref_count 缺省 0、status 缺省「生效」。
        doc_code 重复时整批拒绝并返回冲突的编码值（Issue #3 User Story 5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  minItems: 1
                  description: 本批上传的文档列表
                  items:
                    $ref: '#/components/schemas/DocumentUpload'
            example:
              documents:
                - doc_code: DOC0001
                  title: 关于差旅费报销适用范围的说明（第1版）
                  content: 正文内容……
                  domain: 财务管理
                  last_modified: '2025-07-15'
                  effective_date: '2024-02-19'
      responses:
        '200':
          description: 整批写入成功
          content:
            application/json:
              schema:
                type: object
                required: [inserted]
                properties:
                  inserted:
                    type: integer
                    description: 本次成功写入的文档条数
              example:
                inserted: 300
        '400':
          description: 文档字段不合法（缺字段 / 日期非 ISO-8601 等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_IMPORT_FILE
                message: 文档 DOC0007 的 last_modified 不是 ISO-8601 日期
                location:
                  row: 7
                  column: last_modified
                  value: '2025/07/15'
        '409':
          description: 文档编码重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DUPLICATE_DOC_CODE
                message: 文档编码 DOC0001 已存在，整批导入已回滚
                location:
                  value: DOC0001
        '422':
          description: 请求体结构不合法（缺必填字段 / 类型不匹配）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_FAILED
                message: 请求体不合法：documents 必填，且每个文档必须含 doc_code / title / content / last_modified
                location:
                  column: documents

  /api/tickets:
    post:
      tags: [corpus]
      summary: 批量导入客服工单
      description: |
        上传 CSV 或 JSON 文件批量导入工单，整批在一次事务内提交（Issue #3 User Story 2 / 7）。

        CSV 的列名与 poc/kbgovernance/tickets.csv 一致：
        ticket_id, created_at, channel, content, intent_label, urgency, status, handling_minutes, linked_doc_id
        其中 ticket_id / content / intent_label / created_at 为必填，缺列时错误体给出缺失列名与行号。

        linked_doc_id 是**文档编码文本**（形如 DOC0001），对应 ticket.linked_doc_id →
        document.doc_code 的外键，不是 document.id 的行号；空值与未匹配到文档时写 NULL，
        不做「空串占位」（空串不是合法外键值，SQLite 会直接报 FOREIGN KEY constraint failed）。

        JSON 文件为上述字段的数组。

        上传的文件被原样保存，便于对比系统读到的与上传的是否一致（Issue #3 User Story 9）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 工单文件（CSV 或 JSON）
      responses:
        '200':
          description: 整批写入成功
          content:
            application/json:
              schema:
                type: object
                required: [inserted]
                properties:
                  inserted:
                    type: integer
                    description: 本次成功写入的工单条数
              example:
                inserted: 2000
        '400':
          description: 文件格式不合法（缺列 / 行内取值非法 / 编码无法解析）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_IMPORT_FILE
                message: 工单文件缺少必填列 intent_label
                location:
                  row: 1
                  column: intent_label
        '409':
          description: 工单编码重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DUPLICATE_TICKET_CODE
                message: 工单编码 TK00019 已存在，整批导入已回滚
                location:
                  value: TK00019
        '422':
          description: 请求体结构不合法（缺必填字段 / 类型不匹配）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_FAILED
                message: 请求体不合法：documents 必填，且每个文档必须含 doc_code / title / content / last_modified
                location:
                  column: documents

  /api/scan:
    post:
      tags: [scan]
      summary: 一键运行治理扫描（同步）
      description: |
        同步串行跑完「向量化 → 聚类 → 三模块检测 → 落库」，不引入任务队列（Issue #3）。

        扫描产物沿用 run_all.sh 的文件路径与文件名
        （metrics.json / top15_gaps.csv / corrupt_docs.csv / dup_groups_best.csv 等），
        因此「下载的 CSV 与源文件逐字节一致」与「Web 产物 vs run_all.sh 复跑产物逐字节一致」
        是同一条性质的验证。

        **产物落盘目录是否与 poc/kbgovernance/ 物理隔离，尚未拍板（A1）。**
        现状按「同一目录」写会覆盖仓库里的论文溯源基线，并连带作废
        poc/kbgovernance/repro_check.json 的逐字节基线；隔离方案（Web 扫描写独立
        工作目录、基线目录只读）与取舍见 docs/技术方案/开发前准备清单.md §4.10 A1。

        重复扫描时旧结果被清空而不是叠加（Issue #3 User Story 15）；
        清库必须按外键依赖的子表 → 父表顺序执行（knowledge_gap → cluster_result、
        stale_document / duplicate_group → document），否则 SQLite 会报
        FOREIGN KEY constraint failed。数据库侧还需在**每个连接**上设置
        PRAGMA foreign_keys = ON（该开关按连接生效，不随建表脚本持久化）。
        同一时刻只允许一个扫描在执行，重复请求返回「已有扫描在执行」（Issue #3 User Story 61）。
        语料为空时返回明确的 4xx，不抛未捕获异常（Issue #3 User Story 53）。
        模型权重缺失时返回明确的 HF_HOME 指引（Issue #3 User Story 17）。
      responses:
        '200':
          description: 扫描完成，返回本次的阶段耗时与三模块主指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
              example:
                status: completed
                seconds:
                  encoding: 14.61
                  gap: null
                  corrupt: 0.4
                  duplicate: 0.0
                  total: 3.09
                modules:
                  gap:
                    threshold: 0.62
                    precision: 0.8
                    recall: 0.8
                    f1: 0.8
                    count: 7
                  corrupt:
                    threshold: 3
                    precision: 0.8986
                    recall: 1.0
                    f1: 0.9466
                    count: 69
                  duplicate:
                    threshold: 0.95
                    precision: 1.0
                    recall: 1.0
                    f1: 1.0
                    count: 22
        '400':
          description: 语料为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: EMPTY_CORPUS
                message: 语料为空：请先通过 POST /api/documents 与 POST /api/tickets 录入文档和工单，再运行扫描
                location: {}
        '409':
          description: 已有扫描在执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SCAN_IN_PROGRESS
                message: 已有扫描在执行，请等待当前扫描结束后重试
                location: {}
        '500':
          description: 扫描失败（模型权重缺失或其他原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                model_weights_missing:
                  summary: 模型权重缺失
                  value:
                    code: MODEL_WEIGHTS_MISSING
                    message: 未找到 BAAI/bge-small-zh-v1.5 模型权重：请把 HF_HOME 设为 D:/hf_cache，避免权重落进 C 盘系统盘
                    location: {}
                scan_failed:
                  summary: 扫描执行失败
                  value:
                    code: SCAN_FAILED
                    message: 扫描执行失败：向量聚类阶段异常，未产出清单，请查看服务端日志
                    location: {}

  /api/scan/status:
    get:
      tags: [scan]
      summary: 最近一次扫描的状态
      description: |
        返回最近一次扫描的状态、各阶段耗时、三模块命中数与主指标。

        60 秒需求阈值（Issue #3 断言清单第 6 条）比对的是 seconds.total
        （对应 metrics.json → total_seconds，即 detect.py 全流程墙钟，含聚类开销），
        **不是各阶段耗时之和**：现产物中 corrupt.seconds = 0.4、dup.best.seconds = 0.0，
        缺口阶段暂无独立耗时字段（seconds.gap 为 null），三者相加不等于 total。

        从未扫描过时 status = never_scanned，seconds 与 modules 为 null。
      responses:
        '200':
          description: 最近一次扫描的快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatus'
              example:
                status: completed
                seconds:
                  encoding: 14.61
                  gap: null
                  corrupt: 0.4
                  duplicate: 0.0
                  total: 3.09
                modules:
                  gap:
                    threshold: 0.62
                    precision: 0.8
                    recall: 0.8
                    f1: 0.8
                    count: 7
                  corrupt:
                    threshold: 3
                    precision: 0.8986
                    recall: 1.0
                    f1: 0.9466
                    count: 69
                  duplicate:
                    threshold: 0.95
                    precision: 1.0
                    recall: 1.0
                    f1: 1.0
                    count: 22

  /api/gaps:
    get:
      tags: [findings]
      summary: 知识缺口清单
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        行来自 poc/kbgovernance/top15_gaps.csv 中 cover_median < 本次 threshold 的行，
        字段名与取值与该 CSV 的列一致（缺口与腐化返回的是 CSV 的子集，不是全表）。
        本次阈值 0.62 时命中 7 行，与 metrics.json → gap.best.gap_clusters 一致。

        **rows 的行数可能少于 count**：源文件 top15_gaps.csv 只保留覆盖度最低的 15 个簇，
        当本次阈值的命中簇数超过 15 时（例如 threshold=0.66 时 gap_clusters=27），
        rows 最多只有 15 行。count 是命中簇总数，rows 是可展示的子集，两者不必相等。

        排序参数只提供一档，且不实现分页。**该参数是草案占位：D1 未拍板**
        （Issue #3 第 201 行要求保留，实施方案 §2.2 第 104 行 / §3 第 120 行把列排序列为砍掉项）。
      parameters:
        - name: sort
          in: query
          required: false
          description: 排序字段。草案占位（D1 未拍板）：只允许一档排序参数——工单数（降序，最严重的在前）。取值与清单行的字段名同名（size = 涉及工单数）。
          schema:
            type: string
            enum: [size]
            default: size
      responses:
        '200':
          description: 缺口清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GapList'
              example:
                threshold: 0.62
                precision: 0.8
                recall: 0.8
                f1: 0.8
                count: 7
                rows:
                  - rank: 1
                    intent: 公积金提取材料
                    size: 18
                    cover_median: 0.5629
                    rep_cover: 0.5629
                    rep_ticket: TK00119
                    rep_text: 租房提取和购房提取材料一样吗，麻烦帮忙确认一下流程

  /api/stale:
    get:
      tags: [findings]
      summary: 内容腐化清单
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        行来自 poc/kbgovernance/corrupt_docs.csv（该文件是全量 300 篇逐篇打分表，不是命中清单）
        中 risk_score >= 本次判定阈值的行，字段名与取值与该 CSV 的列一致。
        本次阈值 3 时命中 69 行，与 metrics.json → corrupt.detected 一致。

        源 CSV 还带有若干真值与归因列（in_control_sample / is_dup_copy / dup_source /
        fp_reason），**本接口不透出这些列**；它们只留在产物文件与论文中，用于解释
        7 篇误报的来源（其中 6 篇来自对照集、1 篇是重复件继承了主文档的陈旧
        last_modified，见 poc/kbgovernance/metrics.json → corrupt.fp_from_control
        与 fp_from_dup_inherit）。

        排序参数只提供一档，且不实现分页。**该参数是草案占位：D1 未拍板**
        （Issue #3 第 201 行要求保留，实施方案 §2.2 第 104 行 / §3 第 120 行把列排序列为砍掉项）。
      parameters:
        - name: sort
          in: query
          required: false
          description: 排序字段。草案占位（D1 未拍板）：只允许一档排序参数——风险分（降序，最严重的在前）。取值与清单行的字段名同名（risk_score = 时效性风险分）。
          schema:
            type: string
            enum: [risk_score]
            default: risk_score
      responses:
        '200':
          description: 腐化清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleList'
              example:
                threshold: 3
                precision: 0.8986
                recall: 1.0
                f1: 0.9466
                count: 69
                rows:
                  - doc_id: DOC0241
                    title: 关于客户信息查询授权适用范围的说明（第21版）
                    category: 客户服务
                    last_modified: '2024-05-26'
                    risk_score: 8
                    rule_hits: R1_正文过期日期|R2_更新时间超18个月|R3_正文含绝对过期年份|R4_同类存在更新文档
                    reasons: 正文含早于2026年的日期表述+过期标记词; last_modified=2024-05-26, 距基准日超过18个月; 正文含绝对过期年份 [2024]; 同'客户服务'下有 9 篇更新且标题重合的文档

  /api/duplicates:
    get:
      tags: [findings]
      summary: 重复冗余清单
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        行来自 poc/kbgovernance/dup_groups_best.csv 的全部行（22 组，与 metrics.json →
        dup.best.dup_groups 一致），字段名与取值与该 CSV 的列一致。
        每组给出系统建议保留的主文档（primary_doc）与组内成员（member_docs）。

        源 CSV 的 is_true_group 列（真值标注）**本接口不透出**。

        排序参数只提供一档，且不实现分页。**该参数是草案占位：D1 未拍板**
        （Issue #3 第 201 行要求保留，实施方案 §2.2 第 104 行 / §3 第 120 行把列排序列为砍掉项）。
      parameters:
        - name: sort
          in: query
          required: false
          description: 排序字段。草案占位（D1 未拍板）：只允许一档排序参数——组内最大相似度（降序，最严重的在前）。取值与清单行的字段名同名（max_sim = 组内最大相似度）。
          schema:
            type: string
            enum: [max_sim]
            default: max_sim
      responses:
        '200':
          description: 重复组清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateList'
              example:
                threshold: 0.95
                precision: 1.0
                recall: 1.0
                f1: 1.0
                count: 22
                rows:
                  - group: 1
                    size: 3
                    primary_doc: DOC0003
                    member_docs: DOC0001|DOC0002|DOC0003
                    max_sim: 0.9824

  /api/metrics:
    get:
      tags: [artifacts]
      summary: 读取 metrics.json
      description: |
        返回本次扫描落盘的 metrics.json 内容，供页面显示 threshold 与 P/R/F1。
        页面上的每个数字都从这里读，不在前端代码里写死（Issue #3 User Story 52）。

        字段与 poc/kbgovernance/metrics.json 的顶层键一一对应：
        embedding / gap / corrupt / dup / total_seconds。

        **真值派生字段的处理尚未拍板**：metrics.json 的 corrupt 段含
        control_sampled_doc_ids / fp_control_doc_ids / fp_dup_inherit_doc_ids
        三组文档 id 列表，它们直接指认哪些文档是防作弊对照集、哪些是误报及其归因，
        属真值信息。默认口径是**不外露**（与 C7「清单接口排除真值列」一致），
        只透出阈值、P/R/F1、命中数与计时；若确定要原样透传整份 metrics.json，
        需一并决定页面上如何处置这些 id 列表。取舍见
        docs/技术方案/开发前准备清单.md §4.10 A17。
      responses:
        '200':
          description: metrics.json 的内容
          content:
            application/json:
              schema:
                type: object
                description: metrics.json 的指标部分（字段与产物文件一一对应）
                additionalProperties: true
                properties:
                  embedding:
                    type: object
                    additionalProperties: true
                    description: 向量化引擎的实际级别、模型名、维度与条数（对应 embeddings_meta.json）
                  gap:
                    type: object
                    additionalProperties: true
                    description: 缺口识别结果，含 best（threshold / gap_clusters / detected_intents / precision / recall / f1）、cluster_rows 扫参曲线与 clusters（各 min_cluster_size 下的簇数与噪声条数）
                  corrupt:
                    type: object
                    additionalProperties: true
                    description: 腐化检测结果，含 precision / recall / f1、score_threshold、rule_weight 与逐篇误报归因计数
                  dup:
                    type: object
                    additionalProperties: true
                    description: 重复检测结果，含 best（threshold / dup_groups / detected_docs / group_precision / group_recall / group_f1）与 rows 扫参曲线
                  total_seconds:
                    type: number
                    description: detect.py 全流程墙钟耗时（秒），含聚类开销与三模块检测；不等于各阶段耗时之和

  /api/downloads/{name}:
    get:
      tags: [artifacts]
      summary: 下载扫描产物
      description: |
        下载三类清单的原始 CSV 与 metrics.json。

        返回字节与磁盘上的源文件逐字节一致（Issue #3 断言清单第 10 条），
        因此文件名与取值必须是扫描落盘时的原文件名，不得改写。

        文件名取值与 poc/kbgovernance/ 下扫描产物同名。

        **逐字节一致的范围按文件分档**（见 poc/kbgovernance/repro_check.json）：
        三个清单 CSV 是字节确定的，逐字节一致成立；metrics.json 含计时字段
        （encode_seconds / total_seconds / corrupt.seconds），跨运行必然波动，
        只能「剔除计时字段后一致」，不适用逐字节比对。
      parameters:
        - name: name
          in: path
          required: true
          description: 产物文件名
          schema:
            type: string
            enum:
              - top15_gaps.csv
              - corrupt_docs.csv
              - dup_groups_best.csv
              - metrics.json
      responses:
        '200':
          description: 文件字节（与磁盘源文件逐字节一致）
          headers:
            Content-Disposition:
              description: 附件文件名
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 产物不存在（尚未扫描，或文件名不在允许列表内）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DOWNLOAD_NOT_FOUND
                message: 未找到产物 top15_gaps.csv：请先运行 POST /api/scan
                location:
                  value: top15_gaps.csv

  /docs:
    get:
      tags: [system]
      summary: OpenAPI 契约
      description: |
        返回本 OpenAPI 契约文档（JSON）。

        注意：按 Issue #3「后端全部响应体为 JSON，不含 HTML 页面」这条断言，
        /docs 返回的是契约 JSON 而不是 Swagger UI 页面；
        实现方若沿用 FastAPI 默认的 /docs（Swagger UI，HTML），需改挂 /openapi.json。
      responses:
        '200':
          description: OpenAPI 契约文档
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /:
    get:
      tags: [system]
      summary: 前端构建产物的静态入口
      description: |
        前端构建产物的静态入口（开发态由前端的开发服务器承担，不由本接口承担）。

        本接口只做静态挂载，后端不渲染任何页面、不引入模板引擎；
        契约正文见 system/openapi.yaml。
      responses:
        '200':
          description: 前端入口页（静态挂载提供，非后端渲染）
          content:
            text/html:
              schema:
                type: string
        '404':
          description: 前端构建产物未就位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: 前端构建产物未就位：开发态请用前端的开发服务器访问，开发前请先执行前端构建
                location: {}

components:

  schemas:

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: 固定为 ok 表示服务可用

    CorpusStats:
      type: object
      required: [n_docs, n_tickets, n_passages]
      properties:
        n_docs:
          type: integer
          description: 已录入文档数（对应 metrics.json → embedding.n_docs）
        n_tickets:
          type: integer
          description: 已录入工单数（对应 metrics.json → embedding.n_tickets）
        n_passages:
          type: integer
          description: 文档正文按段落切分后的段数（对应 metrics.json → embedding.n_passages）

    DocumentUpload:
      type: object
      required: [doc_code, title, content, last_modified]
      properties:
        doc_code:
          type: string
          description: 文档编码，全库唯一；重复即拒绝（对应 document.doc_code）
        title:
          type: string
          description: 文档标题（对应 document.title）
        content:
          type: string
          description: 文档正文（对应 document.content）
        domain:
          type: string
          nullable: true
          description: 业务域（对应 document.domain；CSV 里同名列叫 category）
        last_modified:
          type: string
          description: 最后修改日期，ISO-8601（对应 document.last_modified）
        effective_date:
          type: string
          nullable: true
          description: 生效日期，ISO-8601（对应 document.effective_date）
        status:
          type: string
          default: 生效
          description: 文档状态（对应 document.status）
        ref_count:
          type: integer
          default: 0
          description: 被引用次数（对应 document.ref_count）

    Error:
      type: object
      description: 统一的错误响应体：机器可读错误码 + 人可读的中文说明 + 出错位置。
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          enum:
            - INVALID_IMPORT_FILE
            - VALIDATION_FAILED
            - DUPLICATE_DOC_CODE
            - DUPLICATE_TICKET_CODE
            - EMPTY_CORPUS
            - SCAN_IN_PROGRESS
            - SCAN_FAILED
            - MODEL_WEIGHTS_MISSING
            - DOWNLOAD_NOT_FOUND
            - NOT_FOUND
        message:
          type: string
          description: 人可读的中文说明
        location:
          type: object
          description: 出错位置（第几行、缺哪一列、冲突的编码值等）
          additionalProperties: true
          properties:
            row:
              type: integer
              description: 出错行号（从 1 起）
            column:
              type: string
              description: 缺失或非法的列名
            value:
              type: string
              description: 冲突的编码值等具体取值

    GapRow:
      type: object
      description: 知识缺口清单的一行，字段名与取值与 top15_gaps.csv 的列一致。
      required: [rank, intent, size, cover_median]
      properties:
        rank:
          type: integer
          description: 名次（对应 top15_gaps.csv 的 rank）
        intent:
          type: string
          description: 意图名（对应 knowledge_gap.intent_name）
        size:
          type: integer
          description: 涉及工单数（对应 knowledge_gap.ticket_count）
        cover_median:
          type: number
          description: 该意图的段落级覆盖度中位数（对应 knowledge_gap.cover_score）
        rep_cover:
          type: number
          nullable: true
          description: 代表工单的覆盖度
        rep_ticket:
          type: string
          nullable: true
          description: 代表工单号（对应 knowledge_gap.representative_ticket）
        rep_text:
          type: string
          nullable: true
          description: 代表工单原文（对应 knowledge_gap.representative_text）
        # 真值标注列 is_true_gap 不出现在本接口：它只留在产物 CSV 与论文中。
        # 依据：docs/技术方案/开发前准备清单.md C7。

    StaleRow:
      type: object
      description: 内容腐化清单的一行，字段名与取值与 corrupt_docs.csv 的列一致。
      required: [doc_id, risk_score]
      properties:
        doc_id:
          type: string
          description: 文档编码（对应 document.doc_code）
        title:
          type: string
          description: 文档标题（对应 document.title）
        category:
          type: string
          description: 业务域（对应 document.domain）
        last_modified:
          type: string
          description: 最后修改日期（对应 document.last_modified）
        risk_score:
          type: integer
          description: 时效性风险分（对应 stale_document.risk_score）
        rule_hits:
          type: string
          nullable: true
          description: 命中的规则集合，管道符分隔（对应 stale_document.rule_hits）
        reasons:
          type: string
          nullable: true
          description: 逐条规则的理由，分号分隔（对应 stale_document.reasons）

    DuplicateRow:
      type: object
      description: 重复组清单的一行，字段名与取值与 dup_groups_best.csv 的列一致。
      required: [group, size, primary_doc]
      properties:
        group:
          type: integer
          description: 重复组编号
        size:
          type: integer
          description: 组内文档数（对应 duplicate_group.group_size）
        primary_doc:
          type: string
          description: 主文档编码（对应 duplicate_group.primary_doc_id）
        member_docs:
          type: string
          description: 组内成员文档编码，管道符分隔（落库为 duplicate_group.member_doc_ids 的 JSON 数组）
        max_sim:
          type: number
          nullable: true
          description: 组内最大相似度（对应 duplicate_group.max_similarity）
        # 真值标注列 is_true_group 不出现在本接口：它只留在产物 CSV 与论文中。
        # 依据：docs/技术方案/开发前准备清单.md C7。

    GapList:
      type: object
      description: 知识缺口清单：行 + 本次扫描的 threshold 与 P/R/F1。
      required: [threshold, precision, recall, f1, count, rows]
      properties:
        threshold:
          type: number
          description: 本次扫描使用的覆盖度阈值（对应 metrics.json → gap.best.threshold）
        precision:
          type: number
          description: 本次扫描的精确率（对应 metrics.json → gap.best.precision）
        recall:
          type: number
          description: 本次扫描的召回率（对应 metrics.json → gap.best.recall）
        f1:
          type: number
          description: 本次扫描的 F1（对应 metrics.json → gap.best.f1）
        count:
          type: integer
          description: 本次命中的缺口簇数（对应 metrics.json → gap.best.gap_clusters）
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/GapRow'

    StaleList:
      type: object
      description: 内容腐化清单：行 + 本次扫描的 threshold 与 P/R/F1。
      required: [threshold, precision, recall, f1, count, rows]
      properties:
        threshold:
          type: integer
          description: 本次扫描使用的风险分判定阈值（对应 metrics.json → corrupt.score_threshold）
        precision:
          type: number
          description: 本次扫描的精确率（对应 metrics.json → corrupt.precision）
        recall:
          type: number
          description: 本次扫描的召回率（对应 metrics.json → corrupt.recall）
        f1:
          type: number
          description: 本次扫描的 F1（对应 metrics.json → corrupt.f1）
        count:
          type: integer
          description: 本次命中的腐化文档数（对应 metrics.json → corrupt.detected）
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/StaleRow'

    DuplicateList:
      type: object
      description: 重复冗余清单：行 + 本次扫描的 threshold 与 P/R/F1。
      required: [threshold, precision, recall, f1, count, rows]
      properties:
        threshold:
          type: number
          description: 本次扫描使用的余弦阈值（对应 metrics.json → dup.best.threshold）
        precision:
          type: number
          description: 组级精确率（对应 metrics.json → dup.best.group_precision）
        recall:
          type: number
          description: 组级召回率（对应 metrics.json → dup.best.group_recall）
        f1:
          type: number
          description: 组级 F1（对应 metrics.json → dup.best.group_f1）
        count:
          type: integer
          description: 本次命中的重复组数（对应 metrics.json → dup.best.dup_groups）
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/DuplicateRow'

    ScanTiming:
      type: object
      description: 各阶段耗时（秒），字段与 metrics.json 的计时字段一一对应；total 是 detect.py 全流程墙钟，不是各阶段之和。
      properties:
        encoding:
          type: number
          description: 向量化耗时（对应 metrics.json → embedding.encode_seconds）
        gap:
          type: number
          nullable: true
          description: 缺口检测耗时；metrics.json 现无对应字段，落盘时需补齐，否则为 null
        corrupt:
          type: number
          description: 腐化检测耗时（对应 metrics.json → corrupt.seconds）
        duplicate:
          type: number
          description: 重复检测耗时（对应 metrics.json → dup.best.seconds）
        total:
          type: number
          description: detect.py 全流程墙钟耗时（秒），含聚类开销与三模块检测（对应 metrics.json → total_seconds）；不等于各阶段耗时之和

    GapModuleMetrics:
      type: object
      required: [threshold, precision, recall, f1, count]
      properties:
        threshold:
          type: number
          description: 覆盖度阈值
        precision:
          type: number
          description: 精确率
        recall:
          type: number
          description: 召回率
        f1:
          type: number
          description: F1
        count:
          type: integer
          description: 命中缺口簇数

    CorruptModuleMetrics:
      type: object
      required: [threshold, precision, recall, f1, count]
      properties:
        threshold:
          type: integer
          description: 风险分判定阈值
        precision:
          type: number
          description: 精确率
        recall:
          type: number
          description: 召回率
        f1:
          type: number
          description: F1
        count:
          type: integer
          description: 命中腐化文档数

    DuplicateModuleMetrics:
      type: object
      required: [threshold, precision, recall, f1, count]
      properties:
        threshold:
          type: number
          description: 余弦阈值
        precision:
          type: number
          description: 组级精确率
        recall:
          type: number
          description: 组级召回率
        f1:
          type: number
          description: 组级 F1
        count:
          type: integer
          description: 命中重复组数

    ScanModules:
      type: object
      description: 三模块主指标，阈值与 P/R/F1 一律取自本次扫描落盘的 metrics.json。
      properties:
        gap:
          $ref: '#/components/schemas/GapModuleMetrics'
        corrupt:
          $ref: '#/components/schemas/CorruptModuleMetrics'
        duplicate:
          $ref: '#/components/schemas/DuplicateModuleMetrics'

    ScanResult:
      type: object
      description: 本次扫描的结果快照：状态、各阶段耗时、三模块主指标。
      required: [status, seconds, modules]
      properties:
        status:
          type: string
          enum: [completed, failed]
          description: 扫描状态
        seconds:
          $ref: '#/components/schemas/ScanTiming'
        modules:
          $ref: '#/components/schemas/ScanModules'

    ScanStatus:
      type: object
      description: 最近一次扫描的快照；从未扫描过时 seconds 与 modules 为 null。
      required: [status]
      properties:
        status:
          type: string
          enum: [never_scanned, running, completed, failed]
          description: 扫描状态
        seconds:
          allOf:
            - $ref: '#/components/schemas/ScanTiming'
          nullable: true
        modules:
          allOf:
            - $ref: '#/components/schemas/ScanModules'
          nullable: true
