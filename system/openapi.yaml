  /api/gaps:
    get:
      tags: [findings]
      summary: 知识缺口清单（判定单元 = 业务意图）
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        **判定单元 = 业务意图**：行来自 poc/kbgovernance/gap_intents_best.csv 中判定为缺口的
        意图行（该文件只保留缺口意图行，5 行；哪些意图判为缺口见 metrics.json →
        gap.intent_rows 的 is_gap 列），字段名与取值与该 CSV 的列一致。
        意图级覆盖度 = 该意图下所有簇覆盖度的**最小值**（min 聚合，对应 CSV 的
        min_cover_median 列）。本次阈值 0.62 时命中 5 个意图，与 metrics.json →
        gap.best.detected_intents 一致。

        **簇数不是主指标**：簇是算法中间量，一个意图可跨多个簇（本次 5 个意图共跨 7 个
        缺口簇，对应 metrics.json → gap.best.gap_clusters）。簇数只出现在簇级明细里。

        **统计单元与分母**：count 的统计单元 = **业务意图**；precision / recall / f1 的
        分母 = **去重后的业务意图**（对应 metrics.json → gap.best.precision / recall /
        f1），与 count 同一分母，可以直接换算；has_ground_truth=false 时三个指标恒为 null
        （含义是「不可得」，不是 0）。

        **簇级明细不在本接口**：需要簇级明细（cluster_id / intent / size / cover_median /
        rep_cover / purity / n_intent_members 等）时，**通过下载
        poc/kbgovernance/gap_clusters_best.csv 获得**（见 GET /api/downloads/{name}）。
        【待拍板】是否另设 GET /api/gaps/clusters 只读入口：按推荐不设（簇是内部量，
        页面主清单只到意图级）；若页面要做簇级下钻再开这个入口。

        **rows 的行数可能少于 count**：源文件 gap_intents_best.csv 只保留本次固定阈值
        （0.62）下的意图行；本次阈值下命中意图数超过源文件行数时 rows 少于 count，
        页面需自己说明「rows 是可展示子集」。

        **行序 = 源 CSV 行序**：rows 保持 poc/kbgovernance/gap_intents_best.csv 的原始行序
        （该文件已按 min_cover_median 升序排好），可按「文件路径 + 列名」复核；落库时按
        同一顺序写入，knowledge_gap.id 升序与之等价。

        **不提供列排序、不分页**：docs/技术方案/本科版实施方案.md §2.2 第 104 行与 §3
        第 120 行把「分页 / 排序 / 跳转详情」列为砍掉项。

        【待拍板】是否分页：按推荐不设分页（count 与 rows 一次返回，rows 的行数上限由
        源 CSV 的意图行数决定）；代价是命中意图数超过源文件行数时 rows 少于 count。
      responses:
        '200':
          description: 缺口清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GapList'
              example:
                threshold: 0.62
                has_ground_truth: true
                precision: 0.8
                recall: 0.8
                f1: 0.8
                count: 5
                row_order: gap_intents_best.csv 原始行序（min_cover_median 升序）
                rows:
                  - intent: 公积金提取材料
                    n_clusters: 3
                    min_cover_median: 0.5629
                    total_tickets: 76
                    rep_ticket: TK00119
                    rep_text: 租房提取和购房提取材料一样吗，麻烦帮忙确认一下流程

  /api/stale:
    get:
      tags: [findings]
      summary: 内容腐化清单（两个口径并列）
      description: |
        返回「清单行 + 本次扫描的 threshold + 两个口径各自的 P/R/F1 + 合计覆盖面」。

        **两个口径各自独立判定、各自报 P/R/F1，不合成单一 F1**：
          - 内容过期口径（R1_正文过期日期 + R3_正文含绝对过期年份）：真值 32 篇、
            检出 32 篇、TP 32 / FP 0 / FN 0，P/R/F1 = 1.0000 / 1.0000 / 1.0000；
          - 维护周期口径（R2_更新时间超18个月 + R4_同类存在更新文档）：真值 31 篇、
            检出 38 篇、TP 31 / FP 7 / FN 0，P/R/F1 = 0.8158 / 1.0000 / 0.8986。
        两类缺陷语义不同，合成一个分数没有意义，因此本接口**不提供单一的 precision /
        recall / f1**，口径明细见响应体的 by_cause 字段。

        **合计只作覆盖面说明，不报 F1**：埋设 62 篇、检出 69 篇、两口径合并覆盖 62 篇、
        误报 7 篇（对应 metrics.json → corrupt.embedded / detected / covered / fp）。
        注意 by_cause 里两个口径的 detected 之和为 70（32 + 38），与合计 detected 69
        相差 1：DOC0241 埋设的成因是正文过期，但物理上同时满足维护周期口径，
        在两个口径下都算真阳性。两口径命中行的并集为 69 篇（交集 1 篇），
        与 risk_score >= 3 的行集一致。

        行来自 poc/kbgovernance/corrupt_docs.csv（该文件是全量 300 篇逐篇打分表，不是命中清单）
        中 risk_score >= 本次判定阈值的行，字段名与取值与该 CSV 的列一致。
        本次阈值 3 时命中 69 行，与 metrics.json → corrupt.detected 一致。
        行内给出两个口径各自的规则子集加权分（cause_score_content_expiry /
        cause_score_maintenance），各自与本口径的阈值 3 比较。

        源 CSV 还带有若干评测标注与归因列（fp_reason / in_control_sample / is_dup_copy /
        dup_source），**本接口不透出这些列**；它们只留在产物文件与论文中，用于解释
        维护周期口径的 7 篇误报（6 篇来自生成器刻意埋设的「4% 自然陈旧但不算缺陷」
        对照集，1 篇是重复件继承了主文档的陈旧 last_modified，见 poc/kbgovernance/
        metrics.json → corrupt.by_cause.maintenance.fp_attribution）。

        **行序 = 源 CSV 行序**：rows 保持 poc/kbgovernance/corrupt_docs.csv 的原始行序
        （该文件按 risk_score 降序存储），可按「文件路径 + 列名」复核；落库时按同一
        顺序写入，stale_document.id 升序与之等价。

        **不提供列排序、不分页**：docs/技术方案/本科版实施方案.md §2.2 第 104 行与 §3
        第 120 行把「分页 / 排序 / 跳转详情」列为砍掉项。

        【待拍板】是否分页：同 /api/gaps，按推荐不设分页；代价是 count 可以到 69 行
        而 rows 一次返回。
      responses:
        '200':
          description: 腐化清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleList'
              example:
                threshold: 3
                has_ground_truth: true
                count: 69
                embedded: 62
                detected: 69
                covered: 62
                fp: 7
                by_cause:
                  content_expiry:
                    label: 内容过期
                    rules:
                      - R1_正文过期日期
                      - R3_正文含绝对过期年份
                    threshold: 3
                    planted_of_this_nature: 32
                    truth: 32
                    detected: 32
                    tp: 32
                    fp: 0
                    fn: 0
                    precision: 1.0
                    recall: 1.0
                    f1: 1.0
                    has_ground_truth: true
                  maintenance:
                    label: 维护周期
                    rules:
                      - R2_更新时间超18个月
                      - R4_同类存在更新文档
                    threshold: 3
                    planted_of_this_nature: 30
                    truth: 31
                    detected: 38
                    tp: 31
                    fp: 7
                    fn: 0
                    precision: 0.8158
                    recall: 1.0
                    f1: 0.8986
                    has_ground_truth: true
                row_order: corrupt_docs.csv 原始行序（risk_score 降序）
                rows:
                  - doc_id: DOC0241
                    title: 关于客户信息查询授权适用范围的说明（第21版）
                    category: 客户服务
                    last_modified: '2024-05-26'
                    risk_score: 8
                    rule_hits: R1_正文过期日期|R2_更新时间超18个月|R3_正文含绝对过期年份|R4_同类存在更新文档
                    reasons: 正文含早于2026年的日期表述+过期标记词; last_modified=2024-05-26, 距基准日超过18个月; 正文含绝对过期年份 [2024]; 同'客户服务'下有 9 篇更新且标题重合的文档
                    cause_score_content_expiry: 5
                    cause_score_maintenance: 3

  /api/duplicates:
    get:
      tags: [findings]
      summary: 重复冗余清单
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        行来自 poc/kbgovernance/dup_groups_best.csv 的全部行（22 组，与 metrics.json →
        dup.best.dup_groups 一致），字段名与取值与该 CSV 的列一致。
        每组给出系统建议保留的主文档（primary_doc）与组内成员（member_docs）。

        源 CSV 的 is_true_group 列（真值标注）**本接口不透出**。

        **行序 = 源 CSV 行序**：rows 保持 poc/kbgovernance/dup_groups_best.csv 的原始行序
        （group 升序，1..22），可按「文件路径 + 列名」复核；落库时按同一顺序写入，
        duplicate_group.id 升序与之等价。

        **不提供列排序、不分页**：docs/技术方案/本科版实施方案.md §2.2 第 104 行与 §3
        第 120 行把「分页 / 排序 / 跳转详情」列为砍掉项。

        【待拍板】是否分页：同 /api/gaps，按推荐不设分页。

        **P/R/F1 的口径是组级**（对应 metrics.json → dup.best.group_precision /
        group_recall / group_f1）；文档级口径（doc_precision / doc_recall / doc_f1）
        见 OPEN-6，本接口只出组级。
      responses:
        '200':
          description: 重复组清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateList'
              example:
                threshold: 0.95
                has_ground_truth: true
                precision: 1.0
                recall: 1.0
                f1: 1.0
                count: 22
                row_order: dup_groups_best.csv 原始行序（group 升序）
                rows:
                  - group: 1
                    size: 3
                    primary_doc: DOC0003
                    member_docs: DOC0001|DOC0002|DOC0003
                    max_sim: 0.9824

  /api/metrics:
    get:
      tags: [artifacts]
      summary: 读取 metrics.json
      description: |
        返回本次扫描落盘的 metrics.json 内容，供页面显示 threshold 与 P/R/F1。
        页面上的每个数字都从这里读，不在前端代码里写死（Issue #3 User Story 52）。

        字段与 poc/kbgovernance/metrics.json 的顶层键一一对应：
        embedding / has_ground_truth / gap / corrupt / dup / total_seconds。

        **has_ground_truth** 是全局开关：true 表示本次语料带真值标注，各模块的
        precision / recall / f1 有意义；false 时这些指标为 null（含义是「不可得」，
        不是 0），页面据此决定是否显示指标区。

        **缺口段的判定单元 = 业务意图**：主指标是意图级——detected_intents 是检出的
        缺口意图数，precision / recall / f1 的分母是去重后的业务意图。
        gap_clusters（best 内）与 n_gap_clusters 是**簇数**，属于算法内部量与溯源用：
        一个意图可跨多个簇，本次 5 个缺口意图共跨 7 个缺口簇。簇数不作为主指标，
        页面主指标用意图级，簇数只用于溯源说明。

        **腐化段按两个口径分别给指标**：内容过期（R1+R3）与维护周期（R2+R4）语义不同，
        各自独立判定、各自报 P/R/F1，**不合成单一 F1**；顶层 embedded / detected /
        covered / fp / fn 是两口径合计的覆盖面，不带综合 F1。

        **真值派生字段不外露**（口径：docs/技术方案/开发前准备清单.md §4.10 A14
        「真值列是否外泄 → 清单接口不返回真值列」，与 C7 一致）。metrics.json 的
        corrupt 段含 control_sampled_doc_ids，以及 by_cause 下各口径的 truth_doc_ids /
        tp_doc_ids / fp_doc_ids / fn_doc_ids / cross_class_doc_ids 与 fp_attribution，
        它们直接指认哪些文档是防作弊对照集、哪些是误报及其归因，属真值信息；
        本接口只透出阈值、比率、命中数与计时，这些 id 列表与归因明细不出现
        （gap.intent_rows 的 is_true_gap 列同理）。自有语料模式（无真值）下它们本就无从计算。
      responses:
        '200':
          description: metrics.json 的内容
          content:
            application/json:
              schema:
                type: object
                description: metrics.json 的指标部分（字段与产物文件一一对应）
                additionalProperties: true
                properties:
                  has_ground_truth:
                    type: boolean
                    description: 本次语料是否带真值标注；false 时各模块的 precision / recall / f1 为 null（不可得，不是 0）
                  embedding:
                    type: object
                    additionalProperties: true
                    description: 向量化引擎的实际级别、模型名、维度与条数（对应 embeddings_meta.json）
                  gap:
                    type: object
                    additionalProperties: true
                    description: |
                      缺口识别结果，判定单元 = 业务意图。含 best（min_cluster_size / threshold /
                      gap_clusters / detected_intents / precision / recall / f1）、n_gap_clusters、
                      n_gap_intents、gap_intents（检出的缺口意图名数组）、threshold_rows 扫参曲线
                      与 clusters（各 min_cluster_size 下的簇数与噪声条数）。
                      主指标是意图级：detected_intents 与 precision / recall / f1 的分母都是去重后的
                      业务意图；gap_clusters 与 n_gap_clusters 是簇数，属内部量与溯源用
                      （本次 5 个缺口意图共跨 7 个缺口簇），不作为主指标。
                  corrupt:
                    type: object
                    additionalProperties: true
                    description: |
                      腐化检测结果，按两个口径分别给指标。含 by_cause（内容过期 R1+R3 与
                      维护周期 R2+R4 各自的 label / rules / threshold / planted_of_this_nature /
                      detected / tp / fp / fn / precision / recall / f1）、合计 embedded / detected /
                      covered / fp / fn、score_threshold、rule_weight、rule_hit_counts、score_hist
                      与 control_sampled。两口径各自独立判定、各自报 P/R/F1，**不合成单一 F1**；
                      合计字段只作覆盖面说明。
                  dup:
                    type: object
                    additionalProperties: true
                    description: 重复检测结果，含 best（threshold / dup_groups / detected_docs / group_precision / group_recall / group_f1）与 rows 扫参曲线
                  total_seconds:
                    type: number
                    description: detect.py 全流程墙钟耗时（秒），含聚类开销与三模块检测；不等于各阶段耗时之和
              example:
                has_ground_truth: true
                gap:
                  best:
                    min_cluster_size: 5
                    threshold: 0.62
                    gap_clusters: 7
                    detected_intents: 5
                    precision: 0.8
                    recall: 0.8
                    f1: 0.8
                  n_gap_clusters: 7
                  n_gap_intents: 5
                  gap_intents:
                    - 公积金提取材料
                    - 海外出差报销标准
                    - 密码策略例外申请
                    - 社保转移办理
                    - 终端病毒处置
                corrupt:
                  embedded: 62
                  detected: 69
                  covered: 62
                  fp: 7
                  fn: 0
                  score_threshold: 3
                  by_cause:
                    content_expiry:
                      label: 内容过期
                      rules:
                        - R1_正文过期日期
                        - R3_正文含绝对过期年份
                      threshold: 3
                      planted_of_this_nature: 32
                      truth: 32
                      detected: 32
                      tp: 32
                      fp: 0
                      fn: 0
                      precision: 1.0
                      recall: 1.0
                      f1: 1.0
                      has_ground_truth: true
                    maintenance:
                      label: 维护周期
                      rules:
                        - R2_更新时间超18个月
                        - R4_同类存在更新文档
                      threshold: 3
                      planted_of_this_nature: 30
                      truth: 31
                      detected: 38
                      tp: 31
                      fp: 7
                      fn: 0
                      precision: 0.8158
                      recall: 1.0
                      f1: 0.8986
                      has_ground_truth: true
                dup:
                  best:
                    threshold: 0.95
                    dup_groups: 22
                    detected_docs: 49
                    group_precision: 1.0
                    group_recall: 1.0
                    group_f1: 1.0
                total_seconds: 3.82

  /api/downloads/{name}:
    get:
      tags: [artifacts]
      summary: 下载扫描产物
      description: |
        下载扫描产物：三类清单的原始 CSV、语料 CSV、指标文件与复跑一致性记录。

        返回字节与磁盘上的源文件逐字节一致（Issue #3 断言清单第 10 条），
        因此文件名与取值必须是扫描落盘时的原文件名，不得改写。

        **枚举与 poc/kbgovernance/ 下实际存在的机读产物同名**，分两类：
          - 页面清单的投影（三类清单的源文件，页面上看到的行就是这些文件里的行）：
            gap_intents_best.csv、corrupt_docs.csv、dup_groups_best.csv；
          - 全量明细与辅助产物（不直接投影到页面，用于复核与溯源）：
            gap_clusters_best.csv（缺口簇级明细，页面不下钻时靠下载它获得）、
            docs.csv、tickets.csv、metrics.json、gap_threshold.csv、dup_threshold.csv、
            corrupt_rule_ablation_content_expiry.csv、
            corrupt_rule_ablation_maintenance.csv、derived_metrics.csv、granularity.csv、
            granularity_dup.csv、embeddings_meta.json、repro_check.json。

        **消融产物按口径分文件**：原先的单张消融表已拆成
        corrupt_rule_ablation_content_expiry.csv（内容过期口径）与
        corrupt_rule_ablation_maintenance.csv（维护周期口径），两张表各自对应一个口径的
        P/R/F1，不再有合并的单一 F1。

        **下载件保留全量列**（含真值标注列与归因列），与清单接口相反：清单接口不返回
        真值列（口径：§4.10 A14），下载件是论文溯源用的原始产物。

        **为什么下载件不能裁剪**：`docs/技术方案/本科版实施方案.md` §2「M-系统·Web 交付」
        的验收标准要求「直接下载 poc/kbgovernance/ 已产出的 CSV」，且 Issue #3 断言清单
        第 10 条要求「下载的 CSV 与源文件逐字节一致」。裁剪视图会同时违反这两条，
        且会让「逐字节一致」这条可机读复核的验收信号失效。

        **代价与对应义务**：下载件因此会把评测依据（is_true_gap / is_true_group /
        in_control_sample / is_dup_copy / dup_source / fp_reason）一并交给下载者。
        因此下载区必须在按钮附近明示这一点——**「下载的是含评测标注列的原始产物，
        仅用于论文溯源与复现」**，不得静默下载；清单页面本身仍不展示任何真值列
        （同一份源文件在页面上被裁掉了这几列，下载区必须让这一区别可见）。

        **逐字节一致的范围按文件分档**（见 poc/kbgovernance/repro_check.json）：
        三个清单 CSV 与 gap_clusters_best.csv / docs.csv / tickets.csv /
        gap_threshold.csv / corrupt_rule_ablation_content_expiry.csv /
        corrupt_rule_ablation_maintenance.csv / granularity.csv / granularity_dup.csv /
        derived_metrics.csv 是字节确定的，逐字节一致成立；metrics.json 含计时字段
        （encode_seconds / total_seconds / corrupt.seconds）、embeddings_meta.json 含
        encode_seconds、dup_threshold.csv 含 seconds，跨运行必然波动，只能
        「剔除计时字段后一致」，不适用逐字节比对。

        **不在允许列表内**：
          - ground_truth.json —— 真值文件（评测依据），是否开放下载【待拍板】；
            按 A14 的口径默认不开放。
          - doc_emb.npy / ticket_emb.npy / ticket_cover.npy —— 向量化中间二进制，
            不面向用户。
          - 脚本与日志（*.py / *.sh / *.log）、说明文档（*.md）、figures/ —— 不是
            扫描产物。
      parameters:
        - name: name
          in: path
          required: true
          description: 产物文件名
          schema:
            type: string
            enum:
              - gap_intents_best.csv
              - gap_clusters_best.csv
              - corrupt_docs.csv
              - dup_groups_best.csv
              - docs.csv
              - tickets.csv
              - metrics.json
              - gap_threshold.csv
              - dup_threshold.csv
              - corrupt_rule_ablation_content_expiry.csv
              - corrupt_rule_ablation_maintenance.csv
              - derived_metrics.csv
              - granularity.csv
              - granularity_dup.csv
              - embeddings_meta.json
              - repro_check.json
      responses:
        '200':
          description: 文件字节（与磁盘源文件逐字节一致）
          headers:
            Content-Disposition:
              description: 附件文件名
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 产物不存在（尚未扫描，或文件名不在允许列表内）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DOWNLOAD_NOT_FOUND
                message: 未找到产物 gap_intents_best.csv：请先运行 POST /api/scan
                location:
                  value: gap_intents_best.csv

  /docs:
    get:
      tags: [system]
      summary: OpenAPI 契约
      description: |
        返回本 OpenAPI 契约文档（JSON）。

        注意：按 Issue #3「后端全部响应体为 JSON，不含 HTML 页面」这条断言，
        /docs 返回的是契约 JSON 而不是 Swagger UI 页面；
        实现方若沿用 FastAPI 默认的 /docs（Swagger UI，HTML），需改挂 /openapi.json。
      responses:
        '200':
          description: OpenAPI 契约文档
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /:
    get:
      tags: [system]
      summary: 前端构建产物的静态入口
      description: |
        前端构建产物的静态入口（开发态由前端的开发服务器承担，不由本接口承担）。

        本接口只做静态挂载，后端不渲染任何页面、不引入模板引擎；
        契约正文见 system/openapi.yaml。

        **产品形态已定（需求方 2026-10-24 P3 口径）**：前后端分离，且必须「一条命令
        启动前后端」——由后端单进程（FastAPI + uvicorn）挂载前端构建产物，
        SQLite 以 WAL 模式运行（PRAGMA journal_mode = WAL，见 system/schema.sql），
        一条命令同时拉起后端与前端静态资源。本接口就是那条命令启动后的静态挂载点；
        开发态的前端开发服务器仍可单独跑（此时本接口返回 404，见下方错误示例）。
      responses:
        '200':
          description: 前端入口页（静态挂载提供，非后端渲染）
          content:
            text/html:
              schema:
                type: string
        '404':
          description: 前端构建产物未就位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: 前端构建产物未就位：开发态请用前端的开发服务器访问，开发前请先执行前端构建
                location: {}

components:

  schemas:

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: 固定为 ok 表示服务可用

    CorpusStats:
      type: object
      required: [n_docs, n_tickets, n_passages]
      properties:
        n_docs:
          type: integer
          description: 已录入文档数（对应 metrics.json → embedding.n_docs）
        n_tickets:
          type: integer
          description: 已录入工单数（对应 metrics.json → embedding.n_tickets）
        n_passages:
          type: integer
          description: 文档正文按段落切分后的段数（对应 metrics.json → embedding.n_passages）

    DocumentUpload:
      type: object
      required: [doc_code, title, content, last_modified]
      properties:
        doc_code:
          type: string
          description: 文档编码，全库唯一；重复即拒绝（对应 document.doc_code）
        title:
          type: string
          description: 文档标题（对应 document.title）
        content:
          type: string
          description: 文档正文（对应 document.content）
        domain:
          type: string
          nullable: true
          description: 业务域（对应 document.domain；CSV 里同名列叫 category）
        last_modified:
          type: string
          description: 最后修改日期，ISO-8601（对应 document.last_modified）
        effective_date:
          type: string
          nullable: true
          description: 生效日期，ISO-8601（对应 document.effective_date）
        status:
          type: string
          default: 生效
          description: 文档状态（对应 document.status）
        ref_count:
          type: integer
          default: 0
          description: 被引用次数（对应 document.ref_count）

    DocumentSummary:
      type: object
      description: |
        文档清单的一行，字段名与取值与 poc/kbgovernance/docs.csv 的列一致
        （doc_id → doc_code，category → domain）。

        **正文 content 不进列表**，需要正文时按 doc_code 过滤取单篇
        （命中 document.doc_code 的唯一约束）。

        **真值派生列不出现**：docs.csv 的 corrupt / corrupt_reason 两列是评测真值
        派生列，不进清单接口（口径：§4.10 A14）。
      required: [doc_code, title, last_modified, status, ref_count]
      properties:
        doc_code:
          type: string
          description: 文档编码，全库唯一（对应 document.doc_code；CSV 里列名是 doc_id）
        title:
          type: string
          description: 文档标题（对应 document.title）
        domain:
          type: string
          nullable: true
          description: 业务域（对应 document.domain；CSV 里列名是 category）
        created_at:
          type: string
          description: 创建日期，ISO-8601 日期（YYYY-MM-DD，10 字符；对应 document.created_at）
        last_modified:
          type: string
          description: 最后修改日期，ISO-8601 日期（YYYY-MM-DD，10 字符；对应 document.last_modified）
        effective_date:
          type: string
          nullable: true
          description: 生效日期，ISO-8601 日期（YYYY-MM-DD，10 字符；对应 document.effective_date）
        status:
          type: string
          description: 文档状态（对应 document.status）
        ref_count:
          type: integer
          description: 被引用次数（对应 document.ref_count）

    DocumentList:
      type: object
      description: 文档清单：行 + 行序定义 + 计数。
      required: [count, row_order, rows]
      properties:
        count:
          type: integer
          description: 统计单元 = 文档：本次返回的文档条数
        row_order:
          type: string
          description: 行序定义：rows 固定为 document.id 升序（导入写入顺序），与源 CSV 行序一致
        rows:
          type: array
          description: 文档清单行
          items:
            $ref: '#/components/schemas/DocumentSummary'

    TicketSummary:
      type: object
      description: |
        工单清单的一行，字段名与取值与 poc/kbgovernance/tickets.csv 的列一致
        （ticket_id → ticket_code）。

        **正文 content 不进列表**，需要正文时按 ticket_code 过滤取单条
        （命中 ticket.ticket_code 的唯一约束）。
      required: [ticket_code, created_at, channel, intent_label, urgency, status, handling_minutes]
      properties:
        ticket_code:
          type: string
          description: 工单编码，全库唯一（对应 ticket.ticket_code；CSV 里列名是 ticket_id）
        created_at:
          type: string
          description: 工单创建时间，ISO-8601 截断到分钟（YYYY-MM-DDTHH:MM，16 字符；对应 ticket.created_at）
        channel:
          type: string
          description: 工单来源渠道（对应 ticket.channel）
        intent_label:
          type: string
          description: 意图标签（对应 ticket.intent_label）
        urgency:
          type: string
          description: 紧急程度（对应 ticket.urgency）
        status:
          type: string
          description: 工单状态（对应 ticket.status）
        handling_minutes:
          type: integer
          description: 处理时长（分钟；对应 ticket.handling_minutes）
        linked_doc_id:
          type: string
          nullable: true
          description: 关联文档编码（对应 ticket.linked_doc_id，存 doc_code 文本；未匹配到文档时为 null）

    TicketList:
      type: object
      description: 工单清单：行 + 行序定义 + 计数。
      required: [count, row_order, rows]
      properties:
        count:
          type: integer
          description: 统计单元 = 工单：本次返回的工单条数
        row_order:
          type: string
          description: 行序定义：rows 固定为 ticket.id 升序（导入写入顺序），与源 CSV 行序一致
        rows:
          type: array
          description: 工单清单行
          items:
            $ref: '#/components/schemas/TicketSummary'

    Error:
      type: object
      description: 统一的错误响应体：机器可读错误码 + 人可读的中文说明 + 出错位置。
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          enum:
            - INVALID_IMPORT_FILE
            - VALIDATION_FAILED
            - DUPLICATE_DOC_CODE
            - DUPLICATE_TICKET_CODE
            - EMPTY_CORPUS
            - SCAN_IN_PROGRESS
            - SCAN_FAILED
            - MODEL_WEIGHTS_MISSING
            - DOWNLOAD_NOT_FOUND
            - NOT_FOUND
        message:
          type: string
          description: 人可读的中文说明
        location:
          type: object
          description: 出错位置（第几行、缺哪一列、冲突的编码值等）
          additionalProperties: true
          properties:
            row:
              type: integer
              description: 出错行号（从 1 起）
            column:
              type: string
              description: 缺失或非法的列名
            value:
              type: string
              description: 冲突的编码值等具体取值

    GapRow:
      type: object
      description: |
        知识缺口清单的一行，**判定单元 = 业务意图**，字段名与取值与
        poc/kbgovernance/gap_intents_best.csv 的列一致。

        **落库形态（2026-10-25 口径更正后已定）**：knowledge_gap 一行 = 一个业务意图，
        不再是簇级——cover_score 装意图覆盖度（该意图下各簇覆盖度的最小值），
        ticket_count 对应 total_tickets，新增 n_clusters 存该意图下的簇数；
        指向 cluster_result 的外键已取消，意图与簇的对应靠 intent_name ↔ main_intent
        的软链接口径。簇级产物里原有的 rep_cover 在意图级产物中已不存在，
        本接口也不再透出。
      required: [intent, n_clusters, min_cover_median, total_tickets]
      properties:
        intent:
          type: string
          description: |
            业务意图名，缺口判定的最小单元（对应 knowledge_gap.intent_name）。
            一个意图可跨多个簇；行序按 min_cover_median 升序。
        n_clusters:
          type: integer
          description: |
            该意图下的簇数。**簇数是算法内部量与溯源用，不是主指标**；
            本次 5 个缺口意图共跨 7 个缺口簇（metrics.json → gap.best.gap_clusters）。
        min_cover_median:
          type: number
          description: |
            意图级覆盖度 = 该意图下所有簇覆盖度的最小值（min 聚合），
            低于本次 threshold 即判为缺口（对应 knowledge_gap.cover_score）。
        total_tickets:
          type: integer
          description: 该意图涉及的工单总数（对应 knowledge_gap.ticket_count）
        rep_ticket:
          type: string
          nullable: true
          description: 代表工单号（对应 knowledge_gap.representative_ticket）
        rep_text:
          type: string
          nullable: true
          description: 代表工单原文（对应 knowledge_gap.representative_text）
        # 行里不重复给 threshold：响应顶层已给本次阈值。
        # 真值标注列 is_true_gap 不出现在本接口：它只留在产物 CSV 与论文中。
        # 依据：docs/技术方案/开发前准备清单.md §4.10 A14（与 Issue #3 评审意见 C7 一致）。

    StaleRow:
      type: object
      description: |
        内容腐化清单的一行，字段名与取值与 poc/kbgovernance/corrupt_docs.csv 的列一致。
        行内给出两个口径各自的规则子集加权分（cause_score_*），各自与本口径的阈值比较。
      required: [doc_id, risk_score]
      properties:
        doc_id:
          type: string
          description: 文档编码（对应 document.doc_code）
        title:
          type: string
          description: 文档标题（对应 document.title）
        category:
          type: string
          description: 业务域（对应 document.domain）
        last_modified:
          type: string
          description: 最后修改日期（对应 document.last_modified）
        risk_score:
          type: integer
          description: 时效性风险分，四条规则的加权分之和（对应 stale_document.risk_score）
        rule_hits:
          type: string
          nullable: true
          description: 命中的规则集合，管道符分隔（对应 stale_document.rule_hits）
        reasons:
          type: string
          nullable: true
          description: 逐条规则的理由，分号分隔（对应 stale_document.reasons）
        cause_score_content_expiry:
          type: number
          description: |
            内容过期口径（R1 + R3）的规则加权分。该分 >= 本口径阈值 3 时，
            本篇在内容过期口径下命中。
        cause_score_maintenance:
          type: number
          description: |
            维护周期口径（R2 + R4）的规则加权分。该分 >= 本口径阈值 3 时，
            本篇在维护周期口径下命中。
        # 评测标注与归因列 fp_causes / fp_reason / in_control_sample /
        # is_dup_copy / dup_source 不出现在本接口：它们只留在产物 CSV 与论文中。
        # fp_causes 尤其不能外露——它非空即等价于「这一行是误报」，与
        # is_true_gap 同属真值派生列。
        # 依据：docs/技术方案/开发前准备清单.md §4.10 A14（与 Issue #3 评审意见 C7 一致）。

    DuplicateRow:
      type: object
      description: 重复组清单的一行，字段名与取值与 dup_groups_best.csv 的列一致。
      required: [group, size, primary_doc]
      properties:
        group:
          type: integer
          description: 重复组编号
        size:
          type: integer
          description: 组内文档数（对应 duplicate_group.group_size）
        primary_doc:
          type: string
          description: 主文档编码（对应 duplicate_group.primary_doc_id）
        member_docs:
          type: string
          description: 组内成员文档编码，管道符分隔（落库为 duplicate_group.member_doc_ids 的 JSON 数组）
        max_sim:
          type: number
          nullable: true
          description: 组内最大相似度（对应 duplicate_group.max_similarity）
        # 真值标注列 is_true_group 不出现在本接口：它只留在产物 CSV 与论文中。
        # 依据：docs/技术方案/开发前准备清单.md §4.10 A14（与 Issue #3 评审意见 C7 一致）。

    GapList:
      type: object
      description: |
        知识缺口清单：行 + 本次扫描的 threshold 与 P/R/F1。
        判定单元 = 业务意图；count 与 P/R/F1 的分母都是去重后的业务意图。
      required: [threshold, has_ground_truth, precision, recall, f1, count, row_order, rows]
      properties:
        threshold:
          type: number
          description: 本次扫描使用的覆盖度阈值（对应 metrics.json → gap.best.threshold）
        has_ground_truth:
          type: boolean
          description: 本次扫描是否有评测真值。自有语料模式恒为 false（口径：§4.10 A13）
        precision:
          type: number
          nullable: true
          description: 本次扫描的精确率（对应 metrics.json → gap.best.precision）。**统计单元 = 去重后的业务意图**，与同对象的 count（缺口意图数）同一分母，两者可直接换算；has_ground_truth=false 时为 null，含义是「不可得」，不是 0
        recall:
          type: number
          nullable: true
          description: 本次扫描的召回率（对应 metrics.json → gap.best.recall）；has_ground_truth=false 时为 null（不可得）。**统计单元 = 去重后的业务意图**，与同对象的 count 同一分母
        f1:
          type: number
          nullable: true
          description: 本次扫描的 F1（对应 metrics.json → gap.best.f1）；has_ground_truth=false 时为 null（不可得）
        count:
          type: integer
          description: 统计单元 = 业务意图：本次命中的缺口意图数（对应 metrics.json → gap.best.detected_intents）。簇数不作为主指标（见 metrics.json → gap.best.gap_clusters）
        row_order:
          type: string
          description: 行序定义：rows 保持源 CSV 行序（gap_intents_best.csv 原始行序，该文件已按 min_cover_median 升序排好），可按「文件路径 + 列名」复核；不提供列排序与分页
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/GapRow'

    StaleList:
      type: object
      description: |
        内容腐化清单：行 + 本次扫描的 threshold + 两个口径各自的 P/R/F1 + 合计覆盖面。
        **不提供单一的 precision / recall / f1**：两个口径语义不同、各自独立判定，
        合成一个分数没有意义。
      required: [threshold, has_ground_truth, count, embedded, detected, covered, fp, by_cause, row_order, rows]
      properties:
        threshold:
          type: integer
          description: 本次扫描使用的风险分判定阈值（对应 metrics.json → corrupt.score_threshold）
        has_ground_truth:
          type: boolean
          description: 本次扫描是否有评测真值。自有语料模式恒为 false（口径：§4.10 A13）
        count:
          type: integer
          description: 统计单元 = 文档：本次命中的腐化文档数（对应 metrics.json → corrupt.detected），与同对象的 detected 同一数值
        embedded:
          type: integer
          description: 本次语料埋设的腐化文档总数（对应 metrics.json → corrupt.embedded）
        detected:
          type: integer
          description: 本次检出的腐化文档数（对应 metrics.json → corrupt.detected）
        covered:
          type: integer
          description: 两口径合并覆盖的埋设文档数（对应 metrics.json → corrupt.covered）
        fp:
          type: integer
          description: 误报文档数（对应 metrics.json → corrupt.fp）
        by_cause:
          type: object
          description: |
            两个判定口径各自的指标：内容过期（R1 + R3）与维护周期（R2 + R4）。
            键固定为 content_expiry 与 maintenance，各自独立判定、各自报 P/R/F1。
            注意两口径的 detected 之和为 70（32 + 38），与合计 detected 69 相差 1：
            有一篇跨类文档埋设的成因是正文过期，但物理上同时满足维护周期口径，
            在两个口径下都算真阳性。
          properties:
            content_expiry:
              $ref: '#/components/schemas/CorruptCauseMetrics'
            maintenance:
              $ref: '#/components/schemas/CorruptCauseMetrics'
        row_order:
          type: string
          description: 行序定义：rows 保持源 CSV 行序（corrupt_docs.csv 原始行序，该文件按 risk_score 降序存储），可按「文件路径 + 列名」复核；不提供列排序与分页
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/StaleRow'

    CorruptCauseMetrics:
      type: object
      description: |
        内容腐化的一个判定口径（成因类别）：规则、阈值与该口径自身的 P/R/F1。
        两个口径各自独立判定、各自报 P/R/F1，**不合成单一 F1**；
        合计（embedded / detected / covered / fp）只作覆盖面说明，不带综合 F1。
      required: [label, rules, threshold, planted_of_this_nature, truth, detected, tp, fp, fn, precision, recall, f1, has_ground_truth]
      properties:
        label:
          type: string
          description: 口径名（内容过期 / 维护周期）
        rules:
          type: array
          description: 该口径包含的规则编码
          items:
            type: string
        threshold:
          type: integer
          description: 该口径的判定阈值（规则子集加权分 >= 此值即在该口径下命中）
        planted_of_this_nature:
          type: integer
          description: |
            生成器按此成因埋设的文档数（metrics.json → corrupt.by_cause.*.planted_of_this_nature）。
            维护周期口径的埋设数小于该口径的真值数：跨类文档埋设的成因是正文过期，
            但物理上同时满足维护周期口径，在两个口径下都算真阳性。
        truth:
          type: integer
          description: |
            该口径的真值文档数（metrics.json → corrupt.by_cause.*.truth_doc_ids 的条数，
            与分口径消融表 corrupt_rule_ablation_content_expiry.csv /
            corrupt_rule_ablation_maintenance.csv 的 truth 列一致）。
        detected:
          type: integer
          description: 该口径下检出的文档数
        tp:
          type: integer
          description: 该口径下的真阳性文档数
        fp:
          type: integer
          description: 该口径下的误报文档数
        fn:
          type: integer
          description: 该口径下的漏报文档数
        precision:
          type: number
          nullable: true
          description: 该口径的精确率；has_ground_truth=false 时为 null（不可得，不是 0）
        recall:
          type: number
          nullable: true
          description: 该口径的召回率；has_ground_truth=false 时为 null（不可得）
        f1:
          type: number
          nullable: true
          description: 该口径的 F1；has_ground_truth=false 时为 null（不可得）
        has_ground_truth:
          type: boolean
          description: 该口径本次是否有评测真值；为 false 时上面三个指标恒为 null（不可得，不是 0）

    DuplicateList:
      type: object
      description: 重复冗余清单：行 + 本次扫描的 threshold 与 P/R/F1（P/R/F1 为组级口径）。
      required: [threshold, has_ground_truth, precision, recall, f1, count, row_order, rows]
      properties:
        threshold:
          type: number
          description: 本次扫描使用的余弦阈值（对应 metrics.json → dup.best.threshold）
        has_ground_truth:
          type: boolean
          description: 本次扫描是否有评测真值。自有语料模式恒为 false（口径：§4.10 A13）
        precision:
          type: number
          nullable: true
          description: 组级精确率（对应 metrics.json → dup.best.group_precision）。**统计单元 = 重复组**；has_ground_truth=false 时为 null，含义是「不可得」，不是 0
        recall:
          type: number
          nullable: true
          description: 组级召回率（对应 metrics.json → dup.best.group_recall）；has_ground_truth=false 时为 null（不可得）。**统计单元 = 重复组**
        f1:
          type: number
          nullable: true
          description: 组级 F1（对应 metrics.json → dup.best.group_f1）；has_ground_truth=false 时为 null（不可得）
        count:
          type: integer
          description: 统计单元 = 重复组：本次命中的重复组数（对应 metrics.json → dup.best.dup_groups）
        row_order:
          type: string
          description: 行序定义：rows 保持源 CSV 行序（dup_groups_best.csv 原始行序，group 升序），可按「文件路径 + 列名」复核；不提供列排序与分页
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/DuplicateRow'

    ScanRequest:
      type: object
      description: |
        扫描请求体。两种模式：

        **reproduce（复现模式，默认）**：用仓库自带的 PoC 语料
        （poc/kbgovernance/docs.csv、poc/kbgovernance/tickets.csv）与**固定阈值**，
        不按真值择优选参（口径：§4.10 A12）。产物落到扫描工作目录（与
        poc/kbgovernance/ 物理隔离，口径：§4.10 A10），不覆盖论文基线产物。
        仓库自带 ground_truth.json，所以 has_ground_truth=true，P/R/F1 可得。

        **custom（自有语料模式）**：用 POST /api/documents 与 POST /api/tickets 录入的
        语料，阈值取本请求的 thresholds（三个阈值缺一不可）。产物同样落到扫描工作
        目录。没有真值，所以 has_ground_truth=false，P/R/F1 恒为 null（口径：§4.10 A13）。

        两种模式都不写入 poc/kbgovernance/ 目录。
      required: [mode]
      properties:
        mode:
          type: string
          enum: [reproduce, custom]
          default: reproduce
          description: 扫描模式
        thresholds:
          type: object
          description: |
            custom 模式必填（三个阈值缺一不可）；reproduce 模式忽略本字段，改用固定
            阈值：覆盖度 0.62（metrics.json → gap.best.threshold）、风险分 3
            （metrics.json → corrupt.score_threshold）、余弦 0.95
            （metrics.json → dup.best.threshold）。
          properties:
            gap_coverage_threshold:
              type: number
              description: 覆盖度阈值（意图级覆盖度 = 该意图下各簇覆盖度的最小值，低于此值判为知识缺口）
            corrupt_score_threshold:
              type: integer
              description: 风险分判定阈值（规则加权分 ≥ 此值判为内容腐化；两个口径各用自己的规则子集加权分与阈值）
            duplicate_similarity_threshold:
              type: number
              description: 余弦相似度阈值（组内最大相似度 ≥ 此值判为重复组）

    ScanTiming:
      type: object
      description: 各阶段耗时（秒），字段与 metrics.json 的计时字段一一对应；total 是检测环节的全流程墙钟，不是各阶段之和。
      properties:
        encoding:
          type: number
          description: 向量化耗时（对应 metrics.json → embedding.encode_seconds）
        gap:
          type: number
          nullable: true
          description: 缺口检测耗时。**不可得**：metrics.json 的 gap 段没有耗时字段（只有阈值与 P/R/F1），本字段恒为 null；null 表示「不可得」，不是 0
        corrupt:
          type: number
          description: 腐化检测耗时（对应 metrics.json → corrupt.seconds）
        duplicate:
          type: number
          description: 重复检测耗时（对应 metrics.json → dup.best.seconds）。**口径窄**：该字段只包住阈值分组循环，不含 300×300 的余弦矩阵计算（那一段只 print 不落盘），因此前端不能用它推断重复检测的真实耗时
        total:
          type: number
          description: 检测环节的全流程墙钟耗时（秒），对应 metrics.json → total_seconds。按 detect.py 的计时范围，它从读取语料与聚类开始算起，到三模块检测结束，不含向量化那一段（embedding.encode_seconds 单列，两者互不包含），也不等于各阶段耗时之和

    GapModuleMetrics:
      type: object
      required: [threshold, has_ground_truth, precision, recall, f1, count]
      properties:
        threshold:
          type: number
          description: 覆盖度阈值
        has_ground_truth:
          type: boolean
          description: 本模块本次是否有评测真值；为 false 时下面三个指标恒为 null（含义是「不可得」，不是 0）
        precision:
          type: number
          nullable: true
          description: 精确率；has_ground_truth=false 时为 null
        recall:
          type: number
          nullable: true
          description: 召回率；has_ground_truth=false 时为 null
        f1:
          type: number
          nullable: true
          description: F1；has_ground_truth=false 时为 null
        count:
          type: integer
          description: 命中缺口意图数（统计单元 = 业务意图；簇数是内部量，不是主指标）

    CorruptModuleMetrics:
      type: object
      description: |
        内容腐化模块的主指标：两个口径各自报 P/R/F1，另给合计覆盖面。
        **不提供单一的 precision / recall / f1**：两个口径语义不同、各自独立判定。
      required: [threshold, has_ground_truth, count, embedded, detected, covered, fp, by_cause]
      properties:
        threshold:
          type: integer
          description: 风险分判定阈值
        has_ground_truth:
          type: boolean
          description: 本模块本次是否有评测真值；为 false 时各口径的 precision / recall / f1 恒为 null（含义是「不可得」，不是 0）
        count:
          type: integer
          description: 命中腐化文档数（统计单元 = 文档）
        embedded:
          type: integer
          description: 本次语料埋设的腐化文档总数
        detected:
          type: integer
          description: 本次检出的腐化文档数
        covered:
          type: integer
          description: 两口径合并覆盖的埋设文档数
        fp:
          type: integer
          description: 误报文档数
        by_cause:
          type: object
          description: 两个判定口径各自的指标（内容过期 R1+R3 / 维护周期 R2+R4）
          properties:
            content_expiry:
              $ref: '#/components/schemas/CorruptCauseMetrics'
            maintenance:
              $ref: '#/components/schemas/CorruptCauseMetrics'

    DuplicateModuleMetrics:
      type: object
      required: [threshold, has_ground_truth, precision, recall, f1, count]
      properties:
        threshold:
          type: number
          description: 余弦阈值
        has_ground_truth:
          type: boolean
          description: 本模块本次是否有评测真值；为 false 时下面三个指标恒为 null（含义是「不可得」，不是 0）
        precision:
          type: number
          nullable: true
          description: 组级精确率；has_ground_truth=false 时为 null
        recall:
          type: number
          nullable: true
          description: 组级召回率；has_ground_truth=false 时为 null
        f1:
          type: number
          nullable: true
          description: 组级 F1；has_ground_truth=false 时为 null
        count:
          type: integer
          description: 命中重复组数（统计单元 = 组）

    ScanModules:
      type: object
      description: 三模块主指标，阈值与 P/R/F1 一律取自本次扫描落盘的 metrics.json。
      properties:
        gap:
          $ref: '#/components/schemas/GapModuleMetrics'
        corrupt:
          $ref: '#/components/schemas/CorruptModuleMetrics'
        duplicate:
          $ref: '#/components/schemas/DuplicateModuleMetrics'

    ScanResult:
      type: object
      description: 本次扫描的结果快照：状态、各阶段耗时、三模块主指标。
      required: [status, scan_id, mode, artifacts_dir, seconds, modules]
      properties:
        scan_id:
          type: string
          description: 本次扫描的标识（口径：§4.10 A16，每次扫描生成一个 scan_id）
        mode:
          type: string
          enum: [reproduce, custom]
          description: 扫描模式。reproduce = 复现模式（仓库自带 PoC 语料 + 固定阈值）；custom = 自有语料模式（POST 录入的语料 + 请求里给定的阈值）
        artifacts_dir:
          type: string
          description: 本次扫描产物的落盘目录（与 poc/kbgovernance/ 物理隔离，口径：§4.10 A10）
        status:
          type: string
          enum: [completed, failed]
          description: 扫描状态
        seconds:
          $ref: '#/components/schemas/ScanTiming'
        modules:
          $ref: '#/components/schemas/ScanModules'

    ScanStatus:
      type: object
      description: 最近一次扫描的快照；从未扫描过时 scan_id / mode / artifacts_dir / seconds / modules 均为 null。
      required: [status]
      properties:
        status:
          type: string
          enum: [never_scanned, running, completed, failed]
          description: 扫描状态
        scan_id:
          type: string
          nullable: true
          description: 最近一次扫描的标识（口径：§4.10 A16）；从未扫描过时为 null
        mode:
          type: string
          nullable: true
          enum: [reproduce, custom]
          description: 最近一次扫描的模式；从未扫描过时为 null
        artifacts_dir:
          type: string
          nullable: true
          description: 最近一次扫描产物的落盘目录；从未扫描过时为 null
        seconds:
          allOf:
            - $ref: '#/components/schemas/ScanTiming'
          nullable: true
        modules:
          allOf:
            - $ref: '#/components/schemas/ScanModules'
          nullable: true
