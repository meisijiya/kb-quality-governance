  /api/scan:
    post:
      tags: [scan]
      summary: 一键运行治理扫描（同步）
      description: |
        同步串行跑完「向量化 → 聚类 → 三模块检测 → 落库」，不引入任务队列（Issue #3）。

        请求体里的 mode 决定语料来源与阈值口径：reproduce 用仓库自带的 PoC 语料与固定
        阈值，custom 用 POST /api/documents 与 POST /api/tickets 录入的语料与请求里给的
        阈值。两种模式的产物落盘位置相同、且与论文基线物理隔离；指标可得性不同
        （见 ScanRequest 的 has_ground_truth 说明）。

        扫描产物沿用 run_all.sh 的文件路径与文件名
        （metrics.json / gap_intents_best.csv / gap_clusters_best.csv / corrupt_docs.csv /
        dup_groups_best.csv 等），
        因此「下载的 CSV 与源文件逐字节一致」与「Web 产物 vs run_all.sh 复跑产物逐字节一致」
        是同一条性质的验证。

        **产物落盘目录与论文基线物理隔离**（口径：docs/技术方案/开发前准备清单.md
        §4.10 A10「扫描产物落盘目录 → 与论文基线物理隔离」）。Web 扫描写独立工作目录，
        poc/kbgovernance/ 只读；若写回同一目录会覆盖仓库里的论文溯源基线，并连带作废
        poc/kbgovernance/repro_check.json 的逐字节基线与 sync_timings.py 的同步目标。
        契约只约定「落盘目录不与 poc/kbgovernance/ 重叠」，具体路径由实现确定。

        **复现模式用固定阈值，不按真值择优**（口径：§4.10 A12「阈值选取策略」）。
        poc/kbgovernance/detect.py 第 117–127 行与 第 403 行是拿真值择优取 best 的；
        复现模式沿用其固定阈值（覆盖度 0.62 / 风险分 3 / 余弦 0.95，取自
        poc/kbgovernance/metrics.json → gap.best.threshold、corrupt.score_threshold、
        dup.best.threshold），不重新扫参择优。

        每次扫描生成一个 scan_id（口径：§4.10 A16「扫描轮次标识与清库语义」），
        重复扫描时旧结果被清空而不是叠加（Issue #3 User Story 15）；
        清库只清结果表、不动语料表，且必须按外键依赖的子表 → 父表顺序执行：
        先删 knowledge_gap / stale_document / duplicate_group → 再删 cluster_result；
        保留 document / ticket 不动。否则 SQLite 会报 FOREIGN KEY constraint failed。
        （2026-10-25 口径更正后 knowledge_gap 不再是 cluster_result 的子表，
        它与 cluster_result 之间是 intent_name ↔ main_intent 的软链接。）
        数据库侧还需在**每个连接**上设置 PRAGMA foreign_keys = ON（该开关按连接生效，
        不随建表脚本持久化）。

        【待拍板】扫描是否清空语料表：OPEN-1 问的是「扫描要不要连 document / ticket
        一起清掉」。本契约按推荐只清结果表（语料保留，扫描可反复重跑），代价是扫描
        前的语料快照要用户自己管；若要求扫描即清空，则 DELETE /api/documents 与
        DELETE /api/tickets 的整批清空语义改由扫描隐含完成。
        同一时刻只允许一个扫描在执行，重复请求返回「已有扫描在执行」（Issue #3 User Story 61）。
        语料为空时返回明确的 4xx，不抛未捕获异常（Issue #3 User Story 53）。
        模型权重缺失时返回明确的 HF_HOME 指引（Issue #3 User Story 17）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
            example:
              mode: reproduce
      responses:
        '200':
          description: 扫描完成，返回本次的阶段耗时与三模块主指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
              example:
                status: completed
                scan_id: scan-0001
                mode: reproduce
                artifacts_dir: 与 poc/kbgovernance/ 物理隔离的扫描工作目录（路径由实现确定）
                seconds:
                  encoding: 14.61
                  gap: null
                  corrupt: 0.45
                  duplicate: 0.0
                  total: 3.46
                modules:
                  gap:
                    threshold: 0.62
                    precision: 0.8
                    recall: 0.8
                    f1: 0.8
                    count: 5
                    has_ground_truth: true
                  corrupt:
                    threshold: 3
                    has_ground_truth: true
                    count: 69
                    embedded: 62
                    detected: 69
                    covered: 62
                    fp: 7
                    by_cause:
                      content_expiry:
                        label: 内容过期
                        rules:
                          - R1_正文过期日期
                          - R3_正文含绝对过期年份
                        threshold: 3
                        planted_of_this_nature: 32
                        truth: 32
                        detected: 32
                        tp: 32
                        fp: 0
                        fn: 0
                        precision: 1.0
                        recall: 1.0
                        f1: 1.0
                        has_ground_truth: true
                      maintenance:
                        label: 维护周期
                        rules:
                          - R2_更新时间超18个月
                          - R4_同类存在更新文档
                        threshold: 3
                        planted_of_this_nature: 30
                        truth: 31
                        detected: 38
                        tp: 31
                        fp: 7
                        fn: 0
                        precision: 0.8158
                        recall: 1.0
                        f1: 0.8986
                        has_ground_truth: true
                  duplicate:
                    threshold: 0.95
                    precision: 1.0
                    recall: 1.0
                    f1: 1.0
                    count: 22
                    has_ground_truth: true
        '400':
          description: 语料为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: EMPTY_CORPUS
                message: 语料为空：请先通过 POST /api/documents 与 POST /api/tickets 录入文档和工单，再运行扫描
                location: {}
        '409':
          description: 已有扫描在执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SCAN_IN_PROGRESS
                message: 已有扫描在执行，请等待当前扫描结束后重试
                location: {}
        '500':
          description: 扫描失败（模型权重缺失或其他原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
