                scan_id: scan-0001
                mode: reproduce
                artifacts_dir: 与 poc/kbgovernance/ 物理隔离的扫描工作目录（路径由实现确定）
                seconds:
                  encoding: 14.61
                  gap: null
                  corrupt: 0.4
                  duplicate: 0.0
                  total: 3.09
                modules:
                  gap:
                    threshold: 0.62
                    precision: 0.8
                    recall: 0.8
                    f1: 0.8
                    count: 7
                    has_ground_truth: true
                  corrupt:
                    threshold: 3
                    precision: 0.8986
                    recall: 1.0
                    f1: 0.9466
                    count: 69
                    has_ground_truth: true
                  duplicate:
                    threshold: 0.95
                    precision: 1.0
                    recall: 1.0
                    f1: 1.0
                    count: 22
                    has_ground_truth: true

  /api/gaps:
    get:
      tags: [findings]
      summary: 知识缺口清单
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        行来自 poc/kbgovernance/top15_gaps.csv 中 cover_median < 本次 threshold 的行，
        字段名与取值与该 CSV 的列一致（缺口与腐化返回的是 CSV 的子集，不是全表）。
        本次阈值 0.62 时命中 7 行，与 metrics.json → gap.best.gap_clusters 一致。

        **rows 的行数可能少于 count**：源文件 top15_gaps.csv 只保留覆盖度最低的 15 个簇，
        当本次阈值的命中簇数超过 15 时（例如 threshold=0.66 时 gap_clusters=27），
        rows 最多只有 15 行。count 是命中簇总数，rows 是可展示的子集，两者不必相等。

        **行序 = 源 CSV 行序**：rows 保持 poc/kbgovernance/top15_gaps.csv 的原始行序
        （rank 升序，1..15），可按「文件路径 + 列名」复核；落库时按同一顺序写入，
        knowledge_gap.id 升序与之等价。

        **不提供列排序、不分页**：docs/技术方案/本科版实施方案.md §2.2 第 104 行与 §3
        第 120 行把「分页 / 排序 / 跳转详情」列为砍掉项。

        【待拍板】是否分页：按推荐不设分页（count 与 rows 一次返回，rows 的行数上限由
        源 CSV 的 15 行决定）；代价是命中簇数超过源文件行数时 rows 少于 count，页面
        需自己说明「rows 是可展示子集」。
      responses:
        '200':
          description: 缺口清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GapList'
              example:
                threshold: 0.62
                has_ground_truth: true
                precision: 0.8
                recall: 0.8
                f1: 0.8
                count: 7
                row_order: top15_gaps.csv 原始行序（rank 升序）
                rows:
                  - rank: 1
                    intent: 公积金提取材料
                    size: 18
                    cover_median: 0.5629
                    rep_cover: 0.5629
                    rep_ticket: TK00119
                    rep_text: 租房提取和购房提取材料一样吗，麻烦帮忙确认一下流程

  /api/stale:
    get:
      tags: [findings]
      summary: 内容腐化清单
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        行来自 poc/kbgovernance/corrupt_docs.csv（该文件是全量 300 篇逐篇打分表，不是命中清单）
        中 risk_score >= 本次判定阈值的行，字段名与取值与该 CSV 的列一致。
        本次阈值 3 时命中 69 行，与 metrics.json → corrupt.detected 一致。

        源 CSV 还带有若干真值与归因列（in_control_sample / is_dup_copy / dup_source /
        fp_reason），**本接口不透出这些列**；它们只留在产物文件与论文中，用于解释
        7 篇误报的来源（其中 6 篇来自对照集、1 篇是重复件继承了主文档的陈旧
        last_modified，见 poc/kbgovernance/metrics.json → corrupt.fp_from_control
        与 fp_from_dup_inherit）。

        **行序 = 源 CSV 行序**：rows 保持 poc/kbgovernance/corrupt_docs.csv 的原始行序
        （该文件按 risk_score 降序存储），可按「文件路径 + 列名」复核；落库时按同一
        顺序写入，stale_document.id 升序与之等价。

        **不提供列排序、不分页**：docs/技术方案/本科版实施方案.md §2.2 第 104 行与 §3
        第 120 行把「分页 / 排序 / 跳转详情」列为砍掉项。

        【待拍板】是否分页：同 /api/gaps，按推荐不设分页；代价是 count 可以到 69 行
        而 rows 一次返回。
      responses:
        '200':
          description: 腐化清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleList'
              example:
                threshold: 3
                has_ground_truth: true
                precision: 0.8986
                recall: 1.0
                f1: 0.9466
                count: 69
                row_order: corrupt_docs.csv 原始行序（risk_score 降序）
                rows:
                  - doc_id: DOC0241
                    title: 关于客户信息查询授权适用范围的说明（第21版）
                    category: 客户服务
                    last_modified: '2024-05-26'
                    risk_score: 8
                    rule_hits: R1_正文过期日期|R2_更新时间超18个月|R3_正文含绝对过期年份|R4_同类存在更新文档
                    reasons: 正文含早于2026年的日期表述+过期标记词; last_modified=2024-05-26, 距基准日超过18个月; 正文含绝对过期年份 [2024]; 同'客户服务'下有 9 篇更新且标题重合的文档

  /api/duplicates:
    get:
      tags: [findings]
      summary: 重复冗余清单
      description: |
        返回「清单行 + 本次扫描的 threshold 与 P/R/F1」。

        行来自 poc/kbgovernance/dup_groups_best.csv 的全部行（22 组，与 metrics.json →
        dup.best.dup_groups 一致），字段名与取值与该 CSV 的列一致。
        每组给出系统建议保留的主文档（primary_doc）与组内成员（member_docs）。

        源 CSV 的 is_true_group 列（真值标注）**本接口不透出**。

        **行序 = 源 CSV 行序**：rows 保持 poc/kbgovernance/dup_groups_best.csv 的原始行序
        （group 升序，1..22），可按「文件路径 + 列名」复核；落库时按同一顺序写入，
        duplicate_group.id 升序与之等价。

        **不提供列排序、不分页**：docs/技术方案/本科版实施方案.md §2.2 第 104 行与 §3
        第 120 行把「分页 / 排序 / 跳转详情」列为砍掉项。

        【待拍板】是否分页：同 /api/gaps，按推荐不设分页。

        **P/R/F1 的口径是组级**（对应 metrics.json → dup.best.group_precision /
        group_recall / group_f1）；文档级口径（doc_precision / doc_recall / doc_f1）
        见 OPEN-6，本接口只出组级。
      responses:
        '200':
          description: 重复组清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateList'
              example:
                threshold: 0.95
                has_ground_truth: true
                precision: 1.0
                recall: 1.0
                f1: 1.0
                count: 22
                row_order: dup_groups_best.csv 原始行序（group 升序）
                rows:
                  - group: 1
                    size: 3
                    primary_doc: DOC0003
                    member_docs: DOC0001|DOC0002|DOC0003
                    max_sim: 0.9824

  /api/metrics:
    get:
      tags: [artifacts]
      summary: 读取 metrics.json
      description: |
        返回本次扫描落盘的 metrics.json 内容，供页面显示 threshold 与 P/R/F1。
        页面上的每个数字都从这里读，不在前端代码里写死（Issue #3 User Story 52）。

        字段与 poc/kbgovernance/metrics.json 的顶层键一一对应：
        embedding / gap / corrupt / dup / total_seconds。

        **真值派生字段不外露**（口径：docs/技术方案/开发前准备清单.md §4.10 A14
        「真值列是否外泄 → 清单接口不返回真值列」，与 C7 一致）。metrics.json 的
        corrupt 段含 control_sampled_doc_ids / fp_control_doc_ids /
        fp_dup_inherit_doc_ids 三组文档 id 列表，它们直接指认哪些文档是防作弊对照集、
        哪些是误报及其归因，属真值信息；本接口只透出阈值、P/R/F1、命中数与计时，
        这三组 id 列表不出现。自有语料模式（无真值）下它们本就无从计算。
      responses:
        '200':
          description: metrics.json 的内容
          content:
            application/json:
              schema:
                type: object
                description: metrics.json 的指标部分（字段与产物文件一一对应）
                additionalProperties: true
                properties:
                  embedding:
                    type: object
                    additionalProperties: true
                    description: 向量化引擎的实际级别、模型名、维度与条数（对应 embeddings_meta.json）
                  gap:
                    type: object
                    additionalProperties: true
                    description: 缺口识别结果，含 best（threshold / gap_clusters / detected_intents / precision / recall / f1）、cluster_rows 扫参曲线与 clusters（各 min_cluster_size 下的簇数与噪声条数）
                  corrupt:
                    type: object
                    additionalProperties: true
                    description: 腐化检测结果，含 precision / recall / f1、score_threshold、rule_weight 与逐篇误报归因计数
                  dup:
                    type: object
                    additionalProperties: true
                    description: 重复检测结果，含 best（threshold / dup_groups / detected_docs / group_precision / group_recall / group_f1）与 rows 扫参曲线
                  total_seconds:
                    type: number
                    description: detect.py 全流程墙钟耗时（秒），含聚类开销与三模块检测；不等于各阶段耗时之和

  /api/downloads/{name}:
    get:
      tags: [artifacts]
      summary: 下载扫描产物
      description: |
        下载扫描产物：三类清单的原始 CSV、语料 CSV、指标文件与复跑一致性记录。

        返回字节与磁盘上的源文件逐字节一致（Issue #3 断言清单第 10 条），
        因此文件名与取值必须是扫描落盘时的原文件名，不得改写。

        **枚举与 poc/kbgovernance/ 下实际存在的机读产物同名**，分两类：
          - 页面清单的投影（三类清单的源文件，页面上看到的行就是这些文件里的行）：
            top15_gaps.csv、corrupt_docs.csv、dup_groups_best.csv；
          - 全量明细与辅助产物（不直接投影到页面，用于复核与溯源）：
            docs.csv、tickets.csv、metrics.json、gap_threshold.csv、dup_threshold.csv、
            corrupt_rule_ablation.csv、derived_metrics.csv、granularity.csv、
            granularity_dup.csv、embeddings_meta.json、repro_check.json。

        **下载件保留全量列**（含真值标注列与归因列），与清单接口相反：清单接口不返回
        真值列（口径：§4.10 A14），下载件是论文溯源用的原始产物。

        **逐字节一致的范围按文件分档**（见 poc/kbgovernance/repro_check.json）：
        三个清单 CSV 与 docs.csv / tickets.csv / gap_threshold.csv /
        corrupt_rule_ablation.csv / granularity.csv / granularity_dup.csv /
        derived_metrics.csv 是字节确定的，逐字节一致成立；metrics.json 含计时字段
        （encode_seconds / total_seconds / corrupt.seconds）、embeddings_meta.json 含
        encode_seconds、dup_threshold.csv 含 seconds，跨运行必然波动，只能
        「剔除计时字段后一致」，不适用逐字节比对。

        **不在允许列表内**：
          - ground_truth.json —— 真值文件（评测依据），是否开放下载【待拍板】；
            按 A14 的口径默认不开放。
          - doc_emb.npy / ticket_emb.npy / ticket_cover.npy —— 向量化中间二进制，
            不面向用户。
          - 脚本与日志（*.py / *.sh / *.log）、说明文档（*.md）、figures/ —— 不是
            扫描产物。
      parameters:
        - name: name
          in: path
          required: true
          description: 产物文件名
          schema:
            type: string
            enum:
              - top15_gaps.csv
              - corrupt_docs.csv
              - dup_groups_best.csv
              - docs.csv
              - tickets.csv
              - metrics.json
              - gap_threshold.csv
              - dup_threshold.csv
              - corrupt_rule_ablation.csv
              - derived_metrics.csv
              - granularity.csv
              - granularity_dup.csv
              - embeddings_meta.json
              - repro_check.json
      responses:
        '200':
          description: 文件字节（与磁盘源文件逐字节一致）
          headers:
            Content-Disposition:
              description: 附件文件名
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 产物不存在（尚未扫描，或文件名不在允许列表内）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DOWNLOAD_NOT_FOUND
                message: 未找到产物 top15_gaps.csv：请先运行 POST /api/scan
                location:
                  value: top15_gaps.csv

  /docs:
    get:
      tags: [system]
      summary: OpenAPI 契约
      description: |
        返回本 OpenAPI 契约文档（JSON）。

        注意：按 Issue #3「后端全部响应体为 JSON，不含 HTML 页面」这条断言，
        /docs 返回的是契约 JSON 而不是 Swagger UI 页面；
        实现方若沿用 FastAPI 默认的 /docs（Swagger UI，HTML），需改挂 /openapi.json。
      responses:
        '200':
          description: OpenAPI 契约文档
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /:
    get:
      tags: [system]
      summary: 前端构建产物的静态入口
      description: |
        前端构建产物的静态入口（开发态由前端的开发服务器承担，不由本接口承担）。

        本接口只做静态挂载，后端不渲染任何页面、不引入模板引擎；
        契约正文见 system/openapi.yaml。

        **产品形态已定（需求方 2026-10-24 P3 口径）**：前后端分离，且必须「一条命令
        启动前后端」——由后端单进程（FastAPI + uvicorn）挂载前端构建产物，
        SQLite 以 WAL 模式运行（PRAGMA journal_mode = WAL，见 system/schema.sql），
        一条命令同时拉起后端与前端静态资源。本接口就是那条命令启动后的静态挂载点；
        开发态的前端开发服务器仍可单独跑（此时本接口返回 404，见下方错误示例）。
      responses:
        '200':
          description: 前端入口页（静态挂载提供，非后端渲染）
          content:
            text/html:
              schema:
                type: string
        '404':
          description: 前端构建产物未就位
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: 前端构建产物未就位：开发态请用前端的开发服务器访问，开发前请先执行前端构建
                location: {}

components:

  schemas:

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: 固定为 ok 表示服务可用

    CorpusStats:
      type: object
      required: [n_docs, n_tickets, n_passages]
      properties:
        n_docs:
          type: integer
          description: 已录入文档数（对应 metrics.json → embedding.n_docs）
        n_tickets:
          type: integer
          description: 已录入工单数（对应 metrics.json → embedding.n_tickets）
        n_passages:
          type: integer
          description: 文档正文按段落切分后的段数（对应 metrics.json → embedding.n_passages）

    DocumentUpload:
      type: object
      required: [doc_code, title, content, last_modified]
      properties:
        doc_code:
          type: string
          description: 文档编码，全库唯一；重复即拒绝（对应 document.doc_code）
        title:
          type: string
          description: 文档标题（对应 document.title）
        content:
          type: string
          description: 文档正文（对应 document.content）
        domain:
          type: string
          nullable: true
          description: 业务域（对应 document.domain；CSV 里同名列叫 category）
        last_modified:
          type: string
          description: 最后修改日期，ISO-8601（对应 document.last_modified）
        effective_date:
          type: string
          nullable: true
          description: 生效日期，ISO-8601（对应 document.effective_date）
        status:
          type: string
          default: 生效
          description: 文档状态（对应 document.status）
        ref_count:
          type: integer
          default: 0
          description: 被引用次数（对应 document.ref_count）

    DocumentSummary:
      type: object
      description: |
        文档清单的一行，字段名与取值与 poc/kbgovernance/docs.csv 的列一致
        （doc_id → doc_code，category → domain）。

        **正文 content 不进列表**，需要正文时按 doc_code 过滤取单篇
        （命中 document.doc_code 的唯一约束）。

        **真值派生列不出现**：docs.csv 的 corrupt / corrupt_reason 两列是评测真值
        派生列，不进清单接口（口径：§4.10 A14）。
      required: [doc_code, title, last_modified, status, ref_count]
      properties:
        doc_code:
          type: string
          description: 文档编码，全库唯一（对应 document.doc_code；CSV 里列名是 doc_id）
        title:
          type: string
          description: 文档标题（对应 document.title）
        domain:
          type: string
          nullable: true
          description: 业务域（对应 document.domain；CSV 里列名是 category）
        created_at:
          type: string
          description: 创建日期，ISO-8601 日期（YYYY-MM-DD，10 字符；对应 document.created_at）
        last_modified:
          type: string
          description: 最后修改日期，ISO-8601 日期（YYYY-MM-DD，10 字符；对应 document.last_modified）
        effective_date:
          type: string
          nullable: true
          description: 生效日期，ISO-8601 日期（YYYY-MM-DD，10 字符；对应 document.effective_date）
        status:
          type: string
          description: 文档状态（对应 document.status）
        ref_count:
          type: integer
          description: 被引用次数（对应 document.ref_count）

    DocumentList:
      type: object
      description: 文档清单：行 + 行序定义 + 计数。
      required: [count, row_order, rows]
      properties:
        count:
          type: integer
          description: 统计单元 = 文档：本次返回的文档条数
        row_order:
          type: string
          description: 行序定义：rows 固定为 document.id 升序（导入写入顺序），与源 CSV 行序一致
        rows:
          type: array
          description: 文档清单行
          items:
            $ref: '#/components/schemas/DocumentSummary'

    TicketSummary:
      type: object
      description: |
        工单清单的一行，字段名与取值与 poc/kbgovernance/tickets.csv 的列一致
        （ticket_id → ticket_code）。

        **正文 content 不进列表**，需要正文时按 ticket_code 过滤取单条
        （命中 ticket.ticket_code 的唯一约束）。
      required: [ticket_code, created_at, channel, intent_label, urgency, status, handling_minutes]
      properties:
        ticket_code:
          type: string
          description: 工单编码，全库唯一（对应 ticket.ticket_code；CSV 里列名是 ticket_id）
        created_at:
          type: string
          description: 工单创建时间，ISO-8601 截断到分钟（YYYY-MM-DDTHH:MM，16 字符；对应 ticket.created_at）
        channel:
          type: string
          description: 工单来源渠道（对应 ticket.channel）
        intent_label:
          type: string
          description: 意图标签（对应 ticket.intent_label）
        urgency:
          type: string
          description: 紧急程度（对应 ticket.urgency）
        status:
          type: string
          description: 工单状态（对应 ticket.status）
        handling_minutes:
          type: integer
          description: 处理时长（分钟；对应 ticket.handling_minutes）
        linked_doc_id:
          type: string
          nullable: true
          description: 关联文档编码（对应 ticket.linked_doc_id，存 doc_code 文本；未匹配到文档时为 null）

    TicketList:
      type: object
      description: 工单清单：行 + 行序定义 + 计数。
      required: [count, row_order, rows]
      properties:
        count:
          type: integer
          description: 统计单元 = 工单：本次返回的工单条数
        row_order:
          type: string
          description: 行序定义：rows 固定为 ticket.id 升序（导入写入顺序），与源 CSV 行序一致
        rows:
          type: array
          description: 工单清单行
          items:
            $ref: '#/components/schemas/TicketSummary'

    Error:
      type: object
      description: 统一的错误响应体：机器可读错误码 + 人可读的中文说明 + 出错位置。
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          enum:
            - INVALID_IMPORT_FILE
            - VALIDATION_FAILED
            - DUPLICATE_DOC_CODE
            - DUPLICATE_TICKET_CODE
            - EMPTY_CORPUS
            - SCAN_IN_PROGRESS
            - SCAN_FAILED
            - MODEL_WEIGHTS_MISSING
            - DOWNLOAD_NOT_FOUND
            - NOT_FOUND
        message:
          type: string
          description: 人可读的中文说明
        location:
          type: object
          description: 出错位置（第几行、缺哪一列、冲突的编码值等）
          additionalProperties: true
          properties:
            row:
              type: integer
              description: 出错行号（从 1 起）
            column:
              type: string
              description: 缺失或非法的列名
            value:
              type: string
              description: 冲突的编码值等具体取值

    GapRow:
      type: object
      description: 知识缺口清单的一行，字段名与取值与 top15_gaps.csv 的列一致。
      required: [rank, intent, size, cover_median]
      properties:
        rank:
          type: integer
          description: |
            名次（对应 top15_gaps.csv 的 rank 列）。

            rank 是清单行号，不落库为列：行序 = top15_gaps.csv 的原始行序
            （rank 升序 1..15），落库按同一顺序写入 knowledge_gap。
        intent:
          type: string
          description: 意图名（对应 knowledge_gap.intent_name）
        size:
          type: integer
          description: 涉及工单数（对应 knowledge_gap.ticket_count）
        cover_median:
          type: number
          description: 该意图的段落级覆盖度中位数（对应 knowledge_gap.cover_score）
        rep_cover:
          type: number
          nullable: true
          description: |
            代表工单的覆盖度。

            **【待拍板】落库形态**：top15_gaps.csv 有 rep_cover 列，但六表 DDL 里没有
            对应列（knowledge_gap.cover_score 存的是 cover_median）。是新增一列
            rep_cover，还是接受本字段用 cover_median 顶替，待拍板；新增列会偏离
            技术方案 §4.3 的六表 DDL。
        rep_ticket:
          type: string
          nullable: true
          description: 代表工单号（对应 knowledge_gap.representative_ticket）
        rep_text:
          type: string
          nullable: true
          description: 代表工单原文（对应 knowledge_gap.representative_text）
        # 真值标注列 is_true_gap 不出现在本接口：它只留在产物 CSV 与论文中。
        # 依据：docs/技术方案/开发前准备清单.md §4.10 A14（与 Issue #3 评审意见 C7 一致）。

    StaleRow:
      type: object
      description: 内容腐化清单的一行，字段名与取值与 corrupt_docs.csv 的列一致。
      required: [doc_id, risk_score]
      properties:
        doc_id:
          type: string
          description: 文档编码（对应 document.doc_code）
        title:
          type: string
          description: 文档标题（对应 document.title）
        category:
          type: string
          description: 业务域（对应 document.domain）
        last_modified:
          type: string
          description: 最后修改日期（对应 document.last_modified）
        risk_score:
          type: integer
          description: 时效性风险分（对应 stale_document.risk_score）
        rule_hits:
          type: string
          nullable: true
          description: 命中的规则集合，管道符分隔（对应 stale_document.rule_hits）
        reasons:
          type: string
          nullable: true
          description: 逐条规则的理由，分号分隔（对应 stale_document.reasons）

    DuplicateRow:
      type: object
      description: 重复组清单的一行，字段名与取值与 dup_groups_best.csv 的列一致。
      required: [group, size, primary_doc]
      properties:
        group:
          type: integer
          description: 重复组编号
        size:
          type: integer
          description: 组内文档数（对应 duplicate_group.group_size）
        primary_doc:
          type: string
          description: 主文档编码（对应 duplicate_group.primary_doc_id）
        member_docs:
          type: string
          description: 组内成员文档编码，管道符分隔（落库为 duplicate_group.member_doc_ids 的 JSON 数组）
        max_sim:
          type: number
          nullable: true
          description: 组内最大相似度（对应 duplicate_group.max_similarity）
        # 真值标注列 is_true_group 不出现在本接口：它只留在产物 CSV 与论文中。
        # 依据：docs/技术方案/开发前准备清单.md §4.10 A14（与 Issue #3 评审意见 C7 一致）。

    GapList:
      type: object
      description: 知识缺口清单：行 + 本次扫描的 threshold 与 P/R/F1。
      required: [threshold, has_ground_truth, precision, recall, f1, count, row_order, rows]
      properties:
        threshold:
          type: number
          description: 本次扫描使用的覆盖度阈值（对应 metrics.json → gap.best.threshold）
        has_ground_truth:
          type: boolean
          description: 本次扫描是否有评测真值。自有语料模式恒为 false（口径：§4.10 A13）
        precision:
          type: number
          nullable: true
          description: 本次扫描的精确率（对应 metrics.json → gap.best.precision）；has_ground_truth=false 时为 null，含义是「不可得」，不是 0
        recall:
          type: number
          nullable: true
          description: 本次扫描的召回率（对应 metrics.json → gap.best.recall）；has_ground_truth=false 时为 null（不可得）
        f1:
          type: number
          nullable: true
          description: 本次扫描的 F1（对应 metrics.json → gap.best.f1）；has_ground_truth=false 时为 null（不可得）
        count:
          type: integer
          description: 统计单元 = 缺口簇：本次命中的缺口簇数（对应 metrics.json → gap.best.gap_clusters）
        row_order:
          type: string
          description: 行序定义：rows 保持源 CSV 行序（top15_gaps.csv 原始行序，rank 升序），可按「文件路径 + 列名」复核；不提供列排序与分页
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/GapRow'

    StaleList:
      type: object
      description: 内容腐化清单：行 + 本次扫描的 threshold 与 P/R/F1。
      required: [threshold, has_ground_truth, precision, recall, f1, count, row_order, rows]
      properties:
        threshold:
          type: integer
          description: 本次扫描使用的风险分判定阈值（对应 metrics.json → corrupt.score_threshold）
        has_ground_truth:
          type: boolean
          description: 本次扫描是否有评测真值。自有语料模式恒为 false（口径：§4.10 A13）
        precision:
          type: number
          nullable: true
          description: 本次扫描的精确率（对应 metrics.json → corrupt.precision）；has_ground_truth=false 时为 null，含义是「不可得」，不是 0
        recall:
          type: number
          nullable: true
          description: 本次扫描的召回率（对应 metrics.json → corrupt.recall）；has_ground_truth=false 时为 null（不可得）
        f1:
          type: number
          nullable: true
          description: 本次扫描的 F1（对应 metrics.json → corrupt.f1）；has_ground_truth=false 时为 null（不可得）
        count:
          type: integer
          description: 统计单元 = 腐化文档：本次命中的腐化文档数（对应 metrics.json → corrupt.detected）
        row_order:
          type: string
          description: 行序定义：rows 保持源 CSV 行序（corrupt_docs.csv 原始行序，该文件按 risk_score 降序存储），可按「文件路径 + 列名」复核；不提供列排序与分页
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/StaleRow'

    DuplicateList:
      type: object
      description: 重复冗余清单：行 + 本次扫描的 threshold 与 P/R/F1（P/R/F1 为组级口径）。
      required: [threshold, has_ground_truth, precision, recall, f1, count, row_order, rows]
      properties:
        threshold:
          type: number
          description: 本次扫描使用的余弦阈值（对应 metrics.json → dup.best.threshold）
        has_ground_truth:
          type: boolean
          description: 本次扫描是否有评测真值。自有语料模式恒为 false（口径：§4.10 A13）
        precision:
          type: number
          nullable: true
          description: 组级精确率（对应 metrics.json → dup.best.group_precision）；has_ground_truth=false 时为 null，含义是「不可得」，不是 0
        recall:
          type: number
          nullable: true
          description: 组级召回率（对应 metrics.json → dup.best.group_recall）；has_ground_truth=false 时为 null（不可得）
        f1:
          type: number
          nullable: true
          description: 组级 F1（对应 metrics.json → dup.best.group_f1）；has_ground_truth=false 时为 null（不可得）
        count:
          type: integer
          description: 统计单元 = 重复组：本次命中的重复组数（对应 metrics.json → dup.best.dup_groups）
        row_order:
          type: string
          description: 行序定义：rows 保持源 CSV 行序（dup_groups_best.csv 原始行序，group 升序），可按「文件路径 + 列名」复核；不提供列排序与分页
        rows:
          type: array
          description: 清单行（未检出时为空数组）
          items:
            $ref: '#/components/schemas/DuplicateRow'

    ScanRequest:
      type: object
      description: |
        扫描请求体。两种模式：

        **reproduce（复现模式，默认）**：用仓库自带的 PoC 语料
        （poc/kbgovernance/docs.csv、poc/kbgovernance/tickets.csv）与**固定阈值**，
        不按真值择优选参（口径：§4.10 A12）。产物落到扫描工作目录（与
        poc/kbgovernance/ 物理隔离，口径：§4.10 A10），不覆盖论文基线产物。
        仓库自带 ground_truth.json，所以 has_ground_truth=true，P/R/F1 可得。

        **custom（自有语料模式）**：用 POST /api/documents 与 POST /api/tickets 录入的
        语料，阈值取本请求的 thresholds（三个阈值缺一不可）。产物同样落到扫描工作
        目录。没有真值，所以 has_ground_truth=false，P/R/F1 恒为 null（口径：§4.10 A13）。

        两种模式都不写入 poc/kbgovernance/ 目录。
      required: [mode]
      properties:
        mode:
          type: string
          enum: [reproduce, custom]
          default: reproduce
          description: 扫描模式
        thresholds:
          type: object
          description: |
            custom 模式必填（三个阈值缺一不可）；reproduce 模式忽略本字段，改用固定
            阈值：覆盖度 0.62（metrics.json → gap.best.threshold）、风险分 3
            （metrics.json → corrupt.score_threshold）、余弦 0.95
            （metrics.json → dup.best.threshold）。
          properties:
            gap_coverage_threshold:
              type: number
              description: 覆盖度阈值（簇内工单覆盖度低于此值判为知识缺口）
            corrupt_score_threshold:
              type: integer
              description: 风险分判定阈值（规则加权分 ≥ 此值判为内容腐化）
            duplicate_similarity_threshold:
              type: number
              description: 余弦相似度阈值（组内最大相似度 ≥ 此值判为重复组）

    ScanTiming:
      type: object
      description: 各阶段耗时（秒），字段与 metrics.json 的计时字段一一对应；total 是检测环节的全流程墙钟，不是各阶段之和。
      properties:
        encoding:
          type: number
          description: 向量化耗时（对应 metrics.json → embedding.encode_seconds）
        gap:
          type: number
          nullable: true
          description: 缺口检测耗时。**不可得**：metrics.json 的 gap 段没有耗时字段（只有阈值与 P/R/F1），本字段恒为 null；null 表示「不可得」，不是 0
        corrupt:
          type: number
          description: 腐化检测耗时（对应 metrics.json → corrupt.seconds）
        duplicate:
          type: number
          description: 重复检测耗时（对应 metrics.json → dup.best.seconds）
        total:
          type: number
          description: 检测环节的全流程墙钟耗时（秒），含聚类开销与三模块检测（对应 metrics.json → total_seconds）；按 metrics.json 的取值它不覆盖向量化那一段（embedding.encode_seconds 单列，14.61 与 total_seconds 3.09 互不包含），也不等于各阶段耗时之和

    GapModuleMetrics:
      type: object
      required: [threshold, has_ground_truth, precision, recall, f1, count]
      properties:
        threshold:
          type: number
          description: 覆盖度阈值
        has_ground_truth:
          type: boolean
          description: 本模块本次是否有评测真值；为 false 时下面三个指标恒为 null（含义是「不可得」，不是 0）
        precision:
          type: number
          nullable: true
          description: 精确率；has_ground_truth=false 时为 null
        recall:
          type: number
          nullable: true
          description: 召回率；has_ground_truth=false 时为 null
        f1:
          type: number
          nullable: true
          description: F1；has_ground_truth=false 时为 null
        count:
          type: integer
          description: 命中缺口簇数（统计单元 = 簇）

    CorruptModuleMetrics:
      type: object
      required: [threshold, has_ground_truth, precision, recall, f1, count]
      properties:
        threshold:
          type: integer
          description: 风险分判定阈值
        has_ground_truth:
          type: boolean
          description: 本模块本次是否有评测真值；为 false 时下面三个指标恒为 null（含义是「不可得」，不是 0）
        precision:
          type: number
          nullable: true
          description: 精确率；has_ground_truth=false 时为 null
        recall:
          type: number
          nullable: true
          description: 召回率；has_ground_truth=false 时为 null
        f1:
          type: number
          nullable: true
          description: F1；has_ground_truth=false 时为 null
        count:
          type: integer
          description: 命中腐化文档数（统计单元 = 文档）

    DuplicateModuleMetrics:
      type: object
      required: [threshold, has_ground_truth, precision, recall, f1, count]
      properties:
        threshold:
          type: number
          description: 余弦阈值
        has_ground_truth:
          type: boolean
          description: 本模块本次是否有评测真值；为 false 时下面三个指标恒为 null（含义是「不可得」，不是 0）
        precision:
          type: number
          nullable: true
          description: 组级精确率；has_ground_truth=false 时为 null
        recall:
          type: number
          nullable: true
          description: 组级召回率；has_ground_truth=false 时为 null
        f1:
          type: number
          nullable: true
          description: 组级 F1；has_ground_truth=false 时为 null
        count:
          type: integer
          description: 命中重复组数（统计单元 = 组）

    ScanModules:
      type: object
      description: 三模块主指标，阈值与 P/R/F1 一律取自本次扫描落盘的 metrics.json。
      properties:
        gap:
          $ref: '#/components/schemas/GapModuleMetrics'
        corrupt:
          $ref: '#/components/schemas/CorruptModuleMetrics'
        duplicate:
          $ref: '#/components/schemas/DuplicateModuleMetrics'

    ScanResult:
      type: object
      description: 本次扫描的结果快照：状态、各阶段耗时、三模块主指标。
      required: [status, scan_id, mode, artifacts_dir, seconds, modules]
      properties:
        scan_id:
          type: string
          description: 本次扫描的标识（口径：§4.10 A16，每次扫描生成一个 scan_id）
        mode:
          type: string
          enum: [reproduce, custom]
          description: 扫描模式。reproduce = 复现模式（仓库自带 PoC 语料 + 固定阈值）；custom = 自有语料模式（POST 录入的语料 + 请求里给定的阈值）
        artifacts_dir:
          type: string
          description: 本次扫描产物的落盘目录（与 poc/kbgovernance/ 物理隔离，口径：§4.10 A10）
        status:
          type: string
          enum: [completed, failed]
          description: 扫描状态
        seconds:
          $ref: '#/components/schemas/ScanTiming'
        modules:
          $ref: '#/components/schemas/ScanModules'

    ScanStatus:
      type: object
      description: 最近一次扫描的快照；从未扫描过时 scan_id / mode / artifacts_dir / seconds / modules 均为 null。
      required: [status]
      properties:
        status:
          type: string
          enum: [never_scanned, running, completed, failed]
          description: 扫描状态
        scan_id:
          type: string
          nullable: true
          description: 最近一次扫描的标识（口径：§4.10 A16）；从未扫描过时为 null
        mode:
          type: string
          nullable: true
          enum: [reproduce, custom]
          description: 最近一次扫描的模式；从未扫描过时为 null
        artifacts_dir:
          type: string
          nullable: true
          description: 最近一次扫描产物的落盘目录；从未扫描过时为 null
        seconds:
          allOf:
            - $ref: '#/components/schemas/ScanTiming'
          nullable: true
        modules:
          allOf:
            - $ref: '#/components/schemas/ScanModules'
          nullable: true
